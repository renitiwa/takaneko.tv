<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAKANEKO.TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #0a0a0c;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* YouTube UI完全非表示用コンテナ */
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .video-crop-wrapper {
      position: absolute;
      top: -68px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 136px);
      pointer-events: none;
    }
    .video-crop-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    /* リアルなテレビ番組表 (EPG / ラテ欄) */
    .epg-scroll-container {
      position: relative;
      height: 520px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #121316;
      border: 1px solid #26272b;
    }
    .epg-header-row {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 48px 1fr 1fr;
      background: #1a1c20;
      border-bottom: 2px solid #2e3138;
    }
    .epg-body-grid {
      position: relative;
      display: grid;
      grid-template-columns: 48px 1fr 1fr;
      height: 4320px; /* 24時間 × 180px (1分 = 3px) */
    }
    .epg-time-axis {
      background: #16181c;
      border-right: 1px solid #2a2d34;
      position: relative;
    }
    .epg-hour-cell {
      height: 180px;
      border-bottom: 1px solid #2a2d34;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 4px;
      font-size: 13px;
      font-weight: 700;
      color: #a0a5b1;
    }
    .epg-hour-cell.morning { background: rgba(56, 189, 248, 0.04); }
    .epg-hour-cell.daytime { background: rgba(250, 204, 21, 0.04); }
    .epg-hour-cell.prime   { background: rgba(244, 63, 94, 0.05); }
    .epg-hour-cell.night   { background: rgba(99, 102, 241, 0.04); }

    .epg-channel-col {
      position: relative;
      border-right: 1px solid #2a2d34;
      background-image: linear-gradient(to bottom, #22242a 1px, transparent 1px);
      background-size: 100% 180px;
    }
    .epg-program-item {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px solid #2a2d34;
      padding: 4px 8px;
      overflow: hidden;
      background: #141619;
      transition: background 0.15s;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .epg-program-item:hover {
      background: #1d2026;
      z-index: 10;
    }
    .epg-program-item.active-program {
      background: #1e2430;
      border-left: 3px solid #3b82f6;
    }
    .epg-program-item.live-slot {
      background: #2b1419;
      border-left: 3px solid #ef4444;
    }
    .epg-program-item.wait-slot {
      background: #262012;
      border-left: 3px solid #f59e0b;
    }

    /* 現在時刻の赤線 */
    .epg-now-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ef4444;
      z-index: 25;
      pointer-events: none;
    }
    .epg-now-line::before {
      content: "";
      position: absolute;
      left: 44px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }

    /* スクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f1012;
    }
    ::-webkit-scrollbar-thumb {
      background: #2e3138;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- シンプルなヘッダー -->
  <header class="h-14 px-4 border-b border-zinc-800 bg-zinc-950 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-6">
      <div class="text-lg font-black tracking-wider text-white">TAKANEKO.TV</div>
      <nav class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
        <button id="btn-ch1" onclick="switchChannel(1)" class="px-4 py-1.5 rounded-md text-xs font-bold transition bg-white text-black">
          視聴チャンネル1
        </button>
        <button id="btn-ch2" onclick="switchChannel(2)" class="px-4 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white">
          視聴チャンネル2
        </button>
      </nav>
    </div>

    <div class="flex items-center gap-3">
      <button id="btn-audio" onclick="toggleAudio()" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white transition" title="音声切替">
        <svg id="icon-vol-on" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <svg id="icon-vol-off" class="w-4 h-4 hidden text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>
      <div id="clock-display" class="text-xs font-mono text-zinc-400 tabular-nums">00:00:00</div>
    </div>
  </header>

  <!-- メイン視聴エリア -->
  <main class="max-w-[1600px] w-full mx-auto p-4 flex-1 flex flex-col gap-4">
    <div id="stage-grid" class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
      
      <!-- プレイヤー領域 -->
      <div id="player-column" class="lg:col-span-9 flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden">
        <div class="video-viewport">
          <div class="video-crop-wrapper">
            <div id="yt-player"></div>
          </div>

          <!-- クリック透過防止＆初回タッチ時アンミュート用透明レイヤー -->
          <div id="interaction-shield" onclick="ensureAudioUnmuted()" class="absolute inset-0 z-10"></div>

          <!-- 10分前待機画面（視聴チャンネル1のみ） -->
          <div id="standby-overlay" class="hidden absolute inset-0 z-20 bg-zinc-950 flex flex-col items-center justify-center p-6 text-center">
            <p class="text-lg md:text-2xl font-bold text-white tracking-wide">
              配信が開始されるまでお待ちください
            </p>
            <div id="standby-countdown" class="mt-3 text-2xl md:text-4xl font-mono font-black text-zinc-300 tabular-nums"></div>
          </div>
        </div>

        <!-- 現在の番組タイトルバー -->
        <div class="px-4 py-3 bg-zinc-950 border-t border-zinc-900 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <img id="current-thumb" src="" alt="" class="w-12 h-7 object-cover rounded bg-zinc-900 shrink-0 hidden" />
            <div id="current-title" class="text-sm font-bold text-zinc-100 truncate"></div>
          </div>
          <div id="current-time-range" class="text-xs font-mono text-zinc-400 shrink-0 tabular-nums"></div>
        </div>
      </div>

      <!-- YouTubeチャット領域（視聴チャンネル1のみ表示） -->
      <div id="chat-column" class="lg:col-span-3 h-full">
        <div class="bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden h-[360px] lg:h-[calc((100vw-32px)*0.75*9/16+49px)] max-h-[680px]">
          <iframe
            id="yt-chat-frame"
            class="w-full h-full border-0"
            src="about:blank"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          ></iframe>
        </div>
      </div>

    </div>

    <!-- 番組表（3日間・リアルなテレビ番組表スタイル） -->
    <section class="flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden">
      <!-- 日付タブ（3日間） -->
      <div class="px-3 py-2 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
        <div id="epg-day-tabs" class="flex items-center gap-1"></div>
        <button onclick="scrollToCurrentTime()" class="px-3 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-zinc-200 transition">
          現在時刻
        </button>
      </div>

      <!-- 番組表本体 -->
      <div id="epg-scroll" class="epg-scroll-container">
        <div class="epg-header-row">
          <div class="py-2 text-center text-[11px] font-bold text-zinc-500 border-r border-zinc-800">時刻</div>
          <div class="py-2 px-3 text-xs font-bold text-white border-r border-zinc-800">視聴チャンネル1</div>
          <div class="py-2 px-3 text-xs font-bold text-white">視聴チャンネル2</div>
        </div>

        <div id="epg-grid" class="epg-body-grid">
          <div id="epg-time-col" class="epg-time-axis"></div>
          <div id="epg-ch1-col" class="epg-channel-col"></div>
          <div id="epg-ch2-col" class="epg-channel-col"></div>
          <div id="epg-now-bar" class="epg-now-line hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const CHANNEL_HANDLE = '@takaneko_ch';
    const EPOCH_BASE_SEC = Math.floor(new Date('2026-01-01T00:00:00+09:00').getTime() / 1000);
    const PX_PER_MINUTE = 3; // 1分 = 3px (1時間 = 180px, 24時間 = 4320px)

    // 状態管理
    let videoCatalog = [];
    let liveStreamInfo = {
      videoId: null,
      title: '',
      startTimeSec: null, // 配信開始予定時刻(UNIX秒)
      isLiveNow: false
    };

    let activeChannel = 1;
    let selectedDayOffset = 0; // 0: 今日, 1: 明日, 2: 明後日
    let ytPlayer = null;
    let playerReady = false;
    let currentPlayingId = null;
    let currentChatVideoId = null;
    let isMuted = false;

    // 1. シード付き乱数（全デバイス共通のランダム順序を生成）
    function seededRandom(seed) {
      let t = (seed + 0x6D2B79F5) | 0;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function getDeterministicShuffle(list, cycleIndex, channelSalt) {
      const arr = [...list];
      let seed = (cycleIndex * 2654435761) ^ (channelSalt * 1597334677);
      for (let i = arr.length - 1; i > 0; i--) {
        seed = (seed + 1013904223) | 0;
        const j = Math.floor(seededRandom(seed) * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 2. YouTubeの再生時間文字列("12:34" や "1:05:20")を秒数に変換
    function parseDurationText(text) {
      if (!text) return 300;
      const parts = text.trim().split(':').map(Number);
      if (parts.some(isNaN)) return 300;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 300;
    }

    // 3. @takaneko_ch の「動画（Videos）」タブと「ライブ（Streams）」を実際に取得
    async function fetchTextWithFallback(targetUrl) {
      const proxies = [
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
      ];
      for (const buildUrl of proxies) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 7000);
          const res = await fetch(buildUrl(targetUrl), { signal: controller.signal });
          clearTimeout(timer);
          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 500) return text;
          }
        } catch (_) {}
      }
      return null;
    }

    function extractYtInitialData(html) {
      if (!html) return null;
      const patterns = [
        /var ytInitialData\s*=\s*(\{.+?\});<\/script>/s,
        /window\["ytInitialData"\]\s*=\s*(\{.+?\});/s,
        /ytInitialData\s*=\s*(\{.+?\});<\/script>/s
      ];
      for (const regex of patterns) {
        const match = html.match(regex);
        if (match && match[1]) {
          try {
            return JSON.parse(match[1]);
          } catch (_) {}
        }
      }
      return null;
    }

    function collectVideoRenderers(obj, results = []) {
      if (!obj || typeof obj !== 'object') return results;
      if (obj.videoRenderer && obj.videoRenderer.videoId) {
        results.push(obj.videoRenderer);
        return results;
      }
      for (const key of Object.keys(obj)) {
        collectVideoRenderers(obj[key], results);
      }
      return results;
    }

    async function loadTakanekoVideosAndLiveStatus() {
      // URLパラメータでのライブ枠指定にも対応 (?live=VIDEO_ID&start=UNIX_SEC)
      const params = new URLSearchParams(location.search);
      if (params.get('live')) {
        liveStreamInfo.videoId = params.get('live');
        liveStreamInfo.title = params.get('title') || 'たかねこちゃんねる ライブ';
        liveStreamInfo.startTimeSec = params.get('start')
          ? Number(params.get('start'))
          : Math.floor(Date.now() / 1000) - 60;
        liveStreamInfo.isLiveNow = Math.floor(Date.now() / 1000) >= liveStreamInfo.startTimeSec;
      }

      // 1) @takaneko_ch/videos から配信ではないすべての「動画」を取得
      const videosHtml = await fetchTextWithFallback(`https://www.youtube.com/${CHANNEL_HANDLE}/videos?hl=ja`);
      const initialData = extractYtInitialData(videosHtml);

      if (initialData) {
        const renderers = collectVideoRenderers(initialData);
        const parsedVideos = [];
        const seenIds = new Set();

        for (const vr of renderers) {
          const vid = vr.videoId;
          if (!vid || seenIds.has(vid)) continue;

          // ライブ枠や予定枠が混ざっていたらライブ情報として記録し、動画リストからは除外
          const isLiveBadge = JSON.stringify(vr.badges || []).includes('LIVE') ||
                              JSON.stringify(vr.thumbnailOverlays || []).includes('LIVE');
          if (vr.upcomingEventData || isLiveBadge) {
            if (vr.upcomingEventData && vr.upcomingEventData.startTime) {
              liveStreamInfo.videoId = vid;
              liveStreamInfo.title = vr.title?.runs?.[0]?.text || vr.title?.simpleText || 'ライブ';
              liveStreamInfo.startTimeSec = Number(vr.upcomingEventData.startTime);
              liveStreamInfo.isLiveNow = false;
            } else if (isLiveBadge) {
              liveStreamInfo.videoId = vid;
              liveStreamInfo.title = vr.title?.runs?.[0]?.text || vr.title?.simpleText || 'ライブ';
              liveStreamInfo.startTimeSec = Math.floor(Date.now() / 1000) - 300;
              liveStreamInfo.isLiveNow = true;
            }
            continue;
          }

          const title = vr.title?.runs?.[0]?.text || vr.title?.simpleText || '';
          const lenText = vr.lengthText?.simpleText ||
                          vr.thumbnailOverlays?.find(o => o.thumbnailOverlayTimeStatusRenderer)?.thumbnailOverlayTimeStatusRenderer?.text?.simpleText;

          if (title && lenText) {
            seenIds.add(vid);
            parsedVideos.push({
              id: vid,
              title: title,
              duration: Math.max(30, parseDurationText(lenText)),
              thumb: `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`
            });
          }
        }

        if (parsedVideos.length > 0) {
          videoCatalog = parsedVideos;
        }
      }

      // 2) @takaneko_ch/streams からライブ予定枠・現在配信枠をチェック
      const streamsHtml = await fetchTextWithFallback(`https://www.youtube.com/${CHANNEL_HANDLE}/streams?hl=ja`);
      const streamsData = extractYtInitialData(streamsHtml);
      if (streamsData) {
        const streamRenderers = collectVideoRenderers(streamsData);
        for (const sr of streamRenderers) {
          const vid = sr.videoId;
          const title = sr.title?.runs?.[0]?.text || sr.title?.simpleText || 'ライブ';
          const isLiveBadge = JSON.stringify(sr.badges || []).includes('LIVE') ||
                              JSON.stringify(sr.thumbnailOverlays || []).includes('LIVE');

          if (isLiveBadge) {
            liveStreamInfo.videoId = vid;
            liveStreamInfo.title = title;
            if (!liveStreamInfo.startTimeSec) {
              liveStreamInfo.startTimeSec = Math.floor(Date.now() / 1000) - 180;
            }
            liveStreamInfo.isLiveNow = true;
            break;
          } else if (sr.upcomingEventData && sr.upcomingEventData.startTime) {
            liveStreamInfo.videoId = vid;
            liveStreamInfo.title = title;
            liveStreamInfo.startTimeSec = Number(sr.upcomingEventData.startTime);
            liveStreamInfo.isLiveNow = false;
            break;
          }
        }
      }

      renderEpgDayTabs();
      renderEpgGrid();
      syncPlayback(true);
    }

    // 4. 指定されたチャンネル・時間範囲の番組スケジュールを算出
    function getScheduleSlots(channelNum, rangeStartSec, rangeEndSec) {
      if (videoCatalog.length === 0) return [];

      const totalCycleDuration = videoCatalog.reduce((acc, v) => acc + v.duration, 0);
      if (totalCycleDuration <= 0) return [];

      const salt = channelNum === 1 ? 101 : 202;
      const startCycle = Math.floor((rangeStartSec - EPOCH_BASE_SEC) / totalCycleDuration);
      const endCycle = Math.floor((rangeEndSec - EPOCH_BASE_SEC) / totalCycleDuration) + 1;

      const slots = [];

      for (let cycle = startCycle; cycle <= endCycle; cycle++) {
        const shuffled = getDeterministicShuffle(videoCatalog, cycle, salt);
        let cursor = EPOCH_BASE_SEC + cycle * totalCycleDuration;

        for (const video of shuffled) {
          const slotStart = cursor;
          const slotEnd = cursor + video.duration;
          cursor = slotEnd;

          if (slotEnd <= rangeStartSec || slotStart >= rangeEndSec) continue;

          slots.push({
            type: 'video',
            id: video.id,
            title: video.title,
            thumb: `https://i.ytimg.com/vi/${video.id}/mqdefault.jpg`,
            startSec: slotStart,
            endSec: slotEnd,
            duration: video.duration
          });
        }
      }

      // 視聴チャンネル1でたかねこちゃんねるのライブ枠が立っている場合、10分前待機枠＋ライブ枠を上書き反映
      if (channelNum === 1 && liveStreamInfo.videoId && liveStreamInfo.startTimeSec) {
        const waitStart = liveStreamInfo.startTimeSec - 600; // 開始10分前
        const liveStart = liveStreamInfo.startTimeSec;
        const liveEnd = liveStreamInfo.startTimeSec + 7200; // 番組表上のライブ枠表示幅(2時間)

        const filtered = [];
        for (const s of slots) {
          if (s.endSec <= waitStart || s.startSec >= liveEnd) {
            filtered.push(s);
          } else if (s.startSec < waitStart && s.endSec > waitStart) {
            filtered.push({ ...s, endSec: waitStart });
          } else if (s.startSec < liveEnd && s.endSec > liveEnd) {
            filtered.push({ ...s, startSec: liveEnd });
          }
        }

        if (liveStart > rangeStartSec && waitStart < rangeEndSec) {
          filtered.push({
            type: 'wait',
            id: liveStreamInfo.videoId,
            title: '配信が開始されるまでお待ちください',
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: waitStart,
            endSec: liveStart,
            duration: 600
          });
        }

        if (liveEnd > rangeStartSec && liveStart < rangeEndSec) {
          filtered.push({
            type: 'live',
            id: liveStreamInfo.videoId,
            title: liveStreamInfo.title,
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: liveStart,
            endSec: liveEnd,
            duration: liveEnd - liveStart
          });
        }

        filtered.sort((a, b) => a.startSec - b.startSec);
        return filtered;
      }

      return slots;
    }

    function getCurrentSlot(channelNum, nowSec) {
      const slots = getScheduleSlots(channelNum, nowSec - 60, nowSec + 60);
      return slots.find(s => nowSec >= s.startSec && nowSec < s.endSec) || null;
    }

    // 5. YouTube IFrame Player 初期化（字幕強制オフ・音声デフォルトオン・UI非表示）
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        host: 'https://www.youtube-nocookie.com',
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          iv_load_policy: 3,
          cc_load_policy: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          mute: 0,
          hl: 'ja'
        },
        events: {
          onReady: (e) => {
            playerReady = true;
            disableCaptions();
            e.target.unMute();
            e.target.setVolume(100);
            updateAudioIcon();
            syncPlayback(true);
          },
          onStateChange: (e) => {
            disableCaptions();
            if (e.data === YT.PlayerState.UNMUTED || e.data === YT.PlayerState.PLAYING) {
              updateAudioIcon();
            }
            if (e.data === YT.PlayerState.PAUSED) {
              const nowSec = Date.now() / 1000;
              const slot = getCurrentSlot(activeChannel, nowSec);
              if (slot && slot.type !== 'wait') {
                ytPlayer.playVideo();
              }
            }
          },
          onApiChange: () => {
            disableCaptions();
          }
        }
      });
    }

    // 字幕（CC）の強制オフ処理
    function disableCaptions() {
      if (!ytPlayer || !playerReady) return;
      try {
        if (typeof ytPlayer.unloadModule === 'function') {
          ytPlayer.unloadModule('captions');
          ytPlayer.unloadModule('cc');
        }
        if (typeof ytPlayer.setOption === 'function') {
          ytPlayer.setOption('captions', 'track', {});
          ytPlayer.setOption('cc', 'track', {});
        }
      } catch (_) {}
    }

    // 音声コントロール（デフォルトオン＋ブラウザ制限時の自動復帰）
    function ensureAudioUnmuted() {
      if (!ytPlayer || !playerReady) return;
      try {
        if (ytPlayer.isMuted()) {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
          isMuted = false;
          updateAudioIcon();
        }
        if (ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
          ytPlayer.playVideo();
        }
      } catch (_) {}
    }

    window.addEventListener('pointerdown', () => {
      if (!isMuted) ensureAudioUnmuted();
    }, { once: true });

    function toggleAudio() {
      if (!ytPlayer || !playerReady) return;
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
        isMuted = false;
      } else {
        ytPlayer.mute();
        isMuted = true;
      }
      updateAudioIcon();
    }

    function updateAudioIcon() {
      if (!ytPlayer || !playerReady) return;
      const muted = ytPlayer.isMuted();
      document.getElementById('icon-vol-on').classList.toggle('hidden', muted);
      document.getElementById('icon-vol-off').classList.toggle('hidden', !muted);
    }

    // 6. チャンネル切替とYouTubeチャット更新
    function switchChannel(ch) {
      activeChannel = ch;
      const btn1 = document.getElementById('btn-ch1');
      const btn2 = document.getElementById('btn-ch2');
      const chatCol = document.getElementById('chat-column');
      const playerCol = document.getElementById('player-column');

      if (ch === 1) {
        btn1.className = 'px-4 py-1.5 rounded-md text-xs font-bold transition bg-white text-black';
        btn2.className = 'px-4 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white';
        chatCol.classList.remove('hidden');
        playerCol.className = 'lg:col-span-9 flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden';
      } else {
        btn2.className = 'px-4 py-1.5 rounded-md text-xs font-bold transition bg-white text-black';
        btn1.className = 'px-4 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white';
        chatCol.classList.add('hidden');
        playerCol.className = 'lg:col-span-12 flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden';
      }

      currentPlayingId = null;
      syncPlayback(true);
    }

    function updateYouTubeChat(videoId) {
      const chatFrame = document.getElementById('yt-chat-frame');
      if (activeChannel !== 1 || !videoId) {
        if (currentChatVideoId !== null) {
          chatFrame.src = 'about:blank';
          currentChatVideoId = null;
        }
        return;
      }
      if (currentChatVideoId === videoId) return;
      currentChatVideoId = videoId;
      const domain = location.hostname || 'localhost';
      chatFrame.src = `https://www.youtube.com/live_chat?v=${encodeURIComponent(videoId)}&embed_domain=${encodeURIComponent(domain)}&dark_theme=1`;
    }

    // 7. リアルタイム再生同期・10分前待機・ライブ遅延の倍速＆30秒スキップ制御
    function formatHM(sec) {
      const d = new Date(sec * 1000);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function syncPlayback(forceLoad = false) {
      const nowSec = Date.now() / 1000;
      const slot = getCurrentSlot(activeChannel, nowSec);
      const standbyOverlay = document.getElementById('standby-overlay');
      const countdownEl = document.getElementById('standby-countdown');
      const titleEl = document.getElementById('current-title');
      const thumbEl = document.getElementById('current-thumb');
      const timeRangeEl = document.getElementById('current-time-range');

      if (!slot) return;

      // タイトル・サムネイル・時刻を現在の動画と完全一致させる
      titleEl.textContent = slot.title;
      timeRangeEl.textContent = `${formatHM(slot.startSec)} - ${formatHM(slot.endSec)}`;
      if (slot.thumb) {
        thumbEl.src = slot.thumb;
        thumbEl.classList.remove('hidden');
      }

      // 視聴チャンネル1のチャット更新
      updateYouTubeChat(slot.id);

      // 視聴チャンネル1：開始10分前の待機状態
      if (activeChannel === 1 && slot.type === 'wait') {
        standbyOverlay.classList.remove('hidden');
        const remain = Math.max(0, Math.ceil(slot.endSec - nowSec));
        const m = String(Math.floor(remain / 60)).padStart(2, '0');
        const s = String(remain % 60).padStart(2, '0');
        countdownEl.textContent = `${m}:${s}`;

        if (playerReady && ytPlayer) {
          ytPlayer.pauseVideo();
        }
        currentPlayingId = null;
        return;
      }

      standbyOverlay.classList.add('hidden');
      if (!playerReady || !ytPlayer) return;

      const targetOffset = Math.max(0, nowSec - slot.startSec);

      // 動画またはライブ枠が切り替わった場合
      if (forceLoad || currentPlayingId !== slot.id) {
        currentPlayingId = slot.id;
        ytPlayer.loadVideoById({
          videoId: slot.id,
          startSeconds: slot.type === 'live' ? undefined : targetOffset
        });
        disableCaptions();
        if (!isMuted) {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
        }
        return;
      }

      // 遅延検知と自動追いつき（30秒以上遅れで即スキップ、それ以下の遅れは倍速再生）
      const playerTime = ytPlayer.getCurrentTime() || 0;
      const realDuration = ytPlayer.getDuration() || 0;

      let idealTime = targetOffset;
      if (slot.type === 'live' && realDuration > 0) {
        idealTime = realDuration;
      }

      const lag = idealTime - playerTime;

      if (lag >= 30) {
        ytPlayer.seekTo(idealTime, true);
        ytPlayer.setPlaybackRate(1.0);
      } else if (lag > 2.5) {
        ytPlayer.setPlaybackRate(1.5);
      } else if (lag < -3 && slot.type === 'video') {
        ytPlayer.seekTo(idealTime, true);
        ytPlayer.setPlaybackRate(1.0);
      } else {
        if (ytPlayer.getPlaybackRate() !== 1.0) {
          ytPlayer.setPlaybackRate(1.0);
        }
      }
    }

    // 8. 3日間対応のリアルなテレビ番組表 (EPG) 描画
    function getDayStartUnixSec(dayOffset) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + dayOffset);
      return Math.floor(d.getTime() / 1000);
    }

    function renderEpgDayTabs() {
      const container = document.getElementById('epg-day-tabs');
      const weekNames = ['日', '月', '火', '水', '木', '金', '土'];
      container.innerHTML = '';

      for (let i = 0; i < 3; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const label = `${d.getMonth() + 1}/${d.getDate()}(${weekNames[d.getDay()]})`;
        const btn = document.createElement('button');
        btn.className = i === selectedDayOffset
          ? 'px-3 py-1 rounded text-xs font-bold bg-white text-black transition'
          : 'px-3 py-1 rounded text-xs font-bold text-zinc-400 hover:text-white transition';
        btn.textContent = label;
        btn.onclick = () => {
          selectedDayOffset = i;
          renderEpgDayTabs();
          renderEpgGrid();
        };
        container.appendChild(btn);
      }
    }

    function renderEpgGrid() {
      const timeCol = document.getElementById('epg-time-col');
      const ch1Col = document.getElementById('epg-ch1-col');
      const ch2Col = document.getElementById('epg-ch2-col');

      // 左端の24時間時刻軸
      if (timeCol.children.length === 0) {
        let timeHtml = '';
        for (let h = 0; h < 24; h++) {
          let bandClass = 'night';
          if (h >= 5 && h < 11) bandClass = 'morning';
          else if (h >= 11 && h < 18) bandClass = 'daytime';
          else if (h >= 18 && h < 23) bandClass = 'prime';
          timeHtml += `<div class="epg-hour-cell ${bandClass}">${h}</div>`;
        }
        timeCol.innerHTML = timeHtml;
      }

      const dayStartSec = getDayStartUnixSec(selectedDayOffset);
      const dayEndSec = dayStartSec + 86400;
      const nowSec = Date.now() / 1000;

      const ch1Slots = getScheduleSlots(1, dayStartSec, dayEndSec);
      const ch2Slots = getScheduleSlots(2, dayStartSec, dayEndSec);

      ch1Col.innerHTML = buildChannelColumnHtml(ch1Slots, dayStartSec, dayEndSec, nowSec);
      ch2Col.innerHTML = buildChannelColumnHtml(ch2Slots, dayStartSec, dayEndSec, nowSec);

      updateNowBar();
    }

    function buildChannelColumnHtml(slots, dayStartSec, dayEndSec, nowSec) {
      let html = '';
      for (const s of slots) {
        const clampedStart = Math.max(dayStartSec, s.startSec);
        const clampedEnd = Math.min(dayEndSec, s.endSec);
        const topPx = ((clampedStart - dayStartSec) / 60) * PX_PER_MINUTE;
        const heightPx = Math.max(18, ((clampedEnd - clampedStart) / 60) * PX_PER_MINUTE);

        const startDate = new Date(s.startSec * 1000);
        const minStr = String(startDate.getMinutes()).padStart(2, '0');
        const isCurrent = nowSec >= s.startSec && nowSec < s.endSec;

        let extraClass = '';
        if (s.type === 'live') extraClass = 'live-slot';
        else if (s.type === 'wait') extraClass = 'wait-slot';
        else if (isCurrent) extraClass = 'active-program';

        const showThumb = heightPx >= 38;

        html += `
          <div class="epg-program-item ${extraClass}" style="top:${topPx}px; height:${heightPx}px;">
            <span class="text-[11px] font-mono font-bold text-sky-400 shrink-0 leading-tight">${minStr}</span>
            ${showThumb ? `<img src="${s.thumb}" alt="" loading="lazy" class="w-12 h-7 object-cover rounded bg-zinc-900 shrink-0 mt-0.5" />` : ''}
            <div class="text-xs font-medium text-zinc-100 leading-snug line-clamp-2 break-all">${escapeHtml(s.title)}</div>
          </div>
        `;
      }
      return html;
    }

    function updateNowBar() {
      const nowBar = document.getElementById('epg-now-bar');
      if (selectedDayOffset !== 0) {
        nowBar.classList.add('hidden');
        return;
      }
      const dayStartSec = getDayStartUnixSec(0);
      const nowSec = Date.now() / 1000;
      const topPx = ((nowSec - dayStartSec) / 60) * PX_PER_MINUTE;
      nowBar.style.top = `${topPx}px`;
      nowBar.classList.remove('hidden');
    }

    function scrollToCurrentTime() {
      if (selectedDayOffset !== 0) {
        selectedDayOffset = 0;
        renderEpgDayTabs();
        renderEpgGrid();
      }
      const scroller = document.getElementById('epg-scroll');
      const dayStartSec = getDayStartUnixSec(0);
      const nowSec = Date.now() / 1000;
      const topPx = ((nowSec - dayStartSec) / 60) * PX_PER_MINUTE;
      scroller.scrollTo({
        top: Math.max(0, topPx - 140),
        behavior: 'smooth'
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 9. 時計と定期ループの開始
    function tickClock() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${hh}:${mm}:${ss}`;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      tickClock();
      await loadTakanekoVideosAndLiveStatus();
      scrollToCurrentTime();

      setInterval(() => {
        tickClock();
        syncPlayback(false);
        updateNowBar();
      }, 1000);

      // 1分ごとに番組表のハイライト更新とチャンネルのライブ枠チェックを実施
      setInterval(() => {
        renderEpgGrid();
      }, 60000);

      setInterval(() => {
        loadTakanekoVideosAndLiveStatus();
      }, 180000);
    });
  </script>
</body>
