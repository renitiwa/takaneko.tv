<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAKANEKO.TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #090a0c;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* YouTubeの標準UI・タイトル・ロゴを画面外へクロップして完全非表示 */
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .video-viewport:fullscreen {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
    }
    .video-crop-wrapper {
      position: absolute;
      top: -68px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 136px);
      pointer-events: none;
    }
    .video-crop-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    /* プレイヤーホバー・タップ時のカスタムコントロール */
    .player-hud {
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .video-viewport.hud-visible .player-hud,
    .video-viewport:hover .player-hud {
      opacity: 1;
      pointer-events: auto;
    }

    /* リアルなテレビ番組表 (EPG / ラテ欄) */
    .epg-scroll-container {
      position: relative;
      height: 540px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #101216;
      border: 1px solid #242730;
    }
    .epg-header-row {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 52px 1fr 1fr;
      background: #181a20;
      border-bottom: 2px solid #2d313b;
    }
    .epg-body-grid {
      position: relative;
      display: grid;
      grid-template-columns: 52px 1fr 1fr;
      height: 4320px; /* 24時間 × 180px (1分 = 3px) */
    }
    .epg-time-axis {
      background: #14161b;
      border-right: 1px solid #282c35;
      position: relative;
    }
    .epg-hour-cell {
      height: 180px;
      border-bottom: 1px solid #282c35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #9ca3af;
    }
    .epg-hour-cell.morning { background: rgba(56, 189, 248, 0.04); }
    .epg-hour-cell.daytime { background: rgba(250, 204, 21, 0.04); }
    .epg-hour-cell.prime   { background: rgba(244, 63, 94, 0.05); }
    .epg-hour-cell.night   { background: rgba(99, 102, 241, 0.04); }

    .epg-channel-col {
      position: relative;
      border-right: 1px solid #282c35;
      background-image: linear-gradient(to bottom, #20232b 1px, transparent 1px);
      background-size: 100% 180px;
    }
    .epg-program-item {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px solid #282c35;
      padding: 4px 8px;
      overflow: hidden;
      background: #13151a;
      transition: background 0.15s;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .epg-program-item:hover {
      background: #1c2029;
      z-index: 15;
    }
    .epg-program-item.active-program {
      background: #1b2436;
      border-left: 3px solid #38bdf8;
    }
    .epg-program-item.live-slot {
      background: #2c1419;
      border-left: 3px solid #ef4444;
    }
    .epg-program-item.wait-slot {
      background: #282011;
      border-left: 3px solid #f59e0b;
    }

    /* 現在時刻ライン */
    .epg-now-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ef4444;
      z-index: 25;
      pointer-events: none;
    }
    .epg-now-line::before {
      content: "";
      position: absolute;
      left: 47px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0e11;
    }
    ::-webkit-scrollbar-thumb {
      background: #2c303a;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 上部バー -->

        <button id="btn-ch1" onclick="switchChannel(1)" class="px-3 md:px-4 py-1.5 rounded-md text-xs font-bold transition bg-white text-black">

      </nav>
      <button id="btn-epg-toggle" onclick="toggleEpgSection()" class="px-3 py-1.5 rounded-lg border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 text-xs font-bold text-zinc-200 transition">

        <svg id="icon-vol-on" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <svg id="icon-vol-off" class="w-4 h-4 hidden text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />

      </button>

  </header>

  <!-- メインエリア -->

        </div>

        <div class="px-4 py-3 bg-zinc-950 border-t border-zinc-900 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3 min-w-0">

  </main>

    function isExcludedVideo(title, durationSec) {
      if (!title) return true;
      if (/podcast|ポッドキャスト/i.test(title)) return true;
      if (/【リハビリ\d+日目】|【たかねこのドライブゴーゴー】|【視聴者参加型|【コラボ配信】|【ハードコア|【飲酒実況】|【初見プレイ】/.test(title)) return true;
      if (durationSec <= 65) return true;
      if (durationSec >= 3500) return true;
      return false;
    }

    let videoCatalog = BASE_VIDEOS.map(v => ({
      ...v,
      thumb: `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`
    }));

    /**
     * ライブ配信枠の状態管理
     * - isLiveNow: 本番ライブ配信が実際に始まっているか
     * - isUpcoming: 配信開始前の予約枠（待機所）が立っているか
     * - startTimeSec: 配信開始予定時刻（または実際の開始時刻）
     */
    let liveStreamInfo = {
      videoId: null,
      title: '',
      startTimeSec: null,
      isLiveNow: false,
      isUpcoming: false
    };

    let activeChannel = 1;
    let selectedDayOffset = 0;
    let epgVisible = true;
    let ytPlayer = null;
    let playerReady = false;
    let currentPlayingId = null;
    let currentPlayingType = null; // 'video' | 'live' | null
    let currentChatVideoId = null;
    let isMuted = false;
    let userPaused = false;
    let selectedQuality = 'default';
    let hudTimer = null;

    // ライブ配信の遅延計測＆シーク制御用
    let liveEdgeWallOriginSec = null;
    let lastLoadOrSeekMs = 0;
    let lastStandbyPollMs = 0;
    let isCheckingLive = false;

    // 1. 全デバイス共通の決定論的シャッフル（1周するまで同じ動画は出ない）
    function seededRandom(seed) {
      let t = (seed + 0x6D2B79F5) | 0;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function computeCycleOrder(list, cycleIndex, channelSalt) {
      const arr = [...list];
      let seed = (cycleIndex * 2654435761) ^ (channelSalt * 1597334677);
      for (let i = arr.length - 1; i > 0; i--) {
        seed = (seed + 1013904223) | 0;
        const j = Math.floor(seededRandom(seed) * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getDeterministicShuffle(list, cycleIndex, channelSalt) {
      const currentOrder = computeCycleOrder(list, cycleIndex, channelSalt);
      if (currentOrder.length > 1) {
        const prevOrder = computeCycleOrder(list, cycleIndex - 1, channelSalt);
        const prevLastId = prevOrder[prevOrder.length - 1].id;
        if (currentOrder[0].id === prevLastId) {
          [currentOrder[0], currentOrder[1]] = [currentOrder[1], currentOrder[0]];
        }
      }
      return currentOrder;
    }

    // 2. 番組表および再生スケジュール算出
    function getLiveEndTimeSec(nowSec) {
      if (!liveStreamInfo.startTimeSec) return nowSec + 7200;
      const baseEnd = liveStreamInfo.startTimeSec + 7200;
      // 2時間を超える長時間配信中もライブ枠が切れないように動的に延長
      if (liveStreamInfo.isLiveNow || liveStreamInfo.isUpcoming) {
        return Math.max(baseEnd, Math.ceil((nowSec + 3600) / 1800) * 1800);
      }
      return baseEnd;
    }

    function getScheduleSlots(channelNum, rangeStartSec, rangeEndSec) {
      if (videoCatalog.length === 0) return [];

      const totalCycleDuration = videoCatalog.reduce((acc, v) => acc + v.duration, 0);
      if (totalCycleDuration <= 0) return [];

      const salt = channelNum === 1 ? 101 : 202;
      const startCycle = Math.floor((rangeStartSec - EPOCH_BASE_SEC) / totalCycleDuration);
      const endCycle = Math.floor((rangeEndSec - EPOCH_BASE_SEC) / totalCycleDuration) + 1;

      const slots = [];

      for (let cycle = startCycle; cycle <= endCycle; cycle++) {
        const shuffled = getDeterministicShuffle(videoCatalog, cycle, salt);
        let cursor = EPOCH_BASE_SEC + cycle * totalCycleDuration;

        for (const video of shuffled) {
          const slotStart = cursor;
          const slotEnd = cursor + video.duration;
          cursor = slotEnd;

          if (slotEnd <= rangeStartSec || slotStart >= rangeEndSec) continue;

          slots.push({
            type: 'video',
            id: video.id,
            title: video.title,
            thumb: `https://i.ytimg.com/vi/${video.id}/mqdefault.jpg`,
            startSec: slotStart,
            endSec: slotEnd,
            duration: video.duration
          });
        }
      }

      // 視聴チャンネル1のみ、ライブ枠（予約枠・ライブ中）を番組表およびスケジュールへ反映
      if (channelNum === 1 && liveStreamInfo.videoId && liveStreamInfo.startTimeSec) {
        const nowSec = Date.now() / 1000;
        const waitStart = liveStreamInfo.startTimeSec - 600; // 開始10分前
        const liveStart = liveStreamInfo.startTimeSec;
        const liveEnd = getLiveEndTimeSec(nowSec);

        const filtered = [];
        for (const s of slots) {
          if (s.endSec <= waitStart || s.startSec >= liveEnd) {
            filtered.push(s);
          } else if (s.startSec < waitStart && s.endSec > waitStart) {
            filtered.push({ ...s, endSec: waitStart, duration: waitStart - s.startSec });
          } else if (s.startSec < liveEnd && s.endSec > liveEnd) {
            filtered.push({ ...s, startSec: liveEnd, duration: s.endSec - liveEnd });
          }
        }

        if (liveStart > rangeStartSec && waitStart < rangeEndSec) {
          filtered.push({
            type: 'wait',
            id: liveStreamInfo.videoId,
            title: '配信が開始されるまでお待ちください',
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: waitStart,
            endSec: liveStart,
            duration: 600
          });
        }

        if (liveEnd > rangeStartSec && liveStart < rangeEndSec) {
          filtered.push({
            type: 'live',
            id: liveStreamInfo.videoId,
            title: liveStreamInfo.title,
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: liveStart,
            endSec: liveEnd,
            duration: liveEnd - liveStart
          });
        }

        filtered.sort((a, b) => a.startSec - b.startSec);
        return filtered;
      }

      return slots;
    }

    // 現在時刻における視聴チャンネルの再生対象スロットを取得
    function getCurrentSlot(channelNum, nowSec) {
      // 視聴チャンネル1でライブ枠が立っている場合の特別制御
      if (channelNum === 1 && liveStreamInfo.videoId && liveStreamInfo.startTimeSec) {
        const waitStart = liveStreamInfo.startTimeSec - 600;
        const liveEnd = getLiveEndTimeSec(nowSec);

        // 1) 実際にライブ配信が始まっている場合 (行われているとき)
        if (liveStreamInfo.isLiveNow) {
          return {
            type: 'live',
            id: liveStreamInfo.videoId,
            title: liveStreamInfo.title,
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: Math.min(nowSec, liveStreamInfo.startTimeSec),
            endSec: liveEnd,
            duration: liveEnd - liveStreamInfo.startTimeSec
          };
        }

        // 2) ライブ開始前 (残り10分前〜本番ライブが実際に始まるまで)
        if (liveStreamInfo.isUpcoming && nowSec >= waitStart) {
          return {
            type: 'wait',
            id: liveStreamInfo.videoId,
            title: liveStreamInfo.title || '配信が開始されるまでお待ちください',
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: waitStart,
            endSec: Math.max(liveStreamInfo.startTimeSec, nowSec),
            scheduledStartSec: liveStreamInfo.startTimeSec,
            duration: 600
          };
        }
      }

      const slots = getScheduleSlots(channelNum, nowSec - 60, nowSec + 60);
      return slots.find(s => nowSec >= s.startSec && nowSec < s.endSec) || null;
    }

    // 3. YouTube IFrame Player API
    function onYouTubeIframeAPIReady() {
      const nowSec = Date.now() / 1000;
      const initialSlot = getCurrentSlot(activeChannel, nowSec);

      ytPlayer = new YT.Player('yt-player', {
        width: '100%',
        height: '100%',
        videoId: initialSlot && initialSlot.type !== 'wait' ? initialSlot.id : undefined,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          iv_load_policy: 3,
          cc_load_policy: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          hl: 'ja'
        },
        events: {
          onReady: (e) => {
            playerReady = true;
            disableCaptions();
            try {
              e.target.unMute();
              e.target.setVolume(100);
            } catch (_) {}
            updateAudioIcon();
            syncPlayback(true);
          },
          onStateChange: (e) => {
            disableCaptions();
            if (e.data === YT.PlayerState.PLAYING) {
              userPaused = false;
              updatePlayPauseIcon(false);
              if (selectedQuality !== 'default') {
                try { ytPlayer.setPlaybackQuality(selectedQuality); } catch (_) {}
              }
              // ライブ配信再生開始時にライブエッジ基準点を記録
              if (currentPlayingType === 'live') {
                const pTime = typeof ytPlayer.getCurrentTime === 'function' ? ytPlayer.getCurrentTime() : 0;
                if (pTime > 0 && liveEdgeWallOriginSec === null) {
                  liveEdgeWallOriginSec = (Date.now() / 1000) - pTime;
                }
              }
            } else if (e.data === YT.PlayerState.PAUSED) {
              updatePlayPauseIcon(true);
            } else if (e.data === YT.PlayerState.ENDED) {
              // ライブ配信が終了したらライブ状態を解除し、チャットを閉じて通常動画へ戻す
              if (liveStreamInfo.videoId && currentPlayingId === liveStreamInfo.videoId) {
                clearLiveStreamState();
              }
              currentPlayingId = null;
              currentPlayingType = null;
              syncPlayback(true);
            }
          },
          onPlaybackQualityChange: () => {
            disableCaptions();
          },
          onApiChange: () => {
            disableCaptions();
          },
          onError: () => {
            // もしライブ開始直前でまだ再生不可だった場合は待機状態を維持して再チェック
            if (currentPlayingType === 'live' && liveStreamInfo.videoId) {
              liveStreamInfo.isLiveNow = false;
              liveStreamInfo.isUpcoming = true;
            }
            currentPlayingId = null;
            currentPlayingType = null;
            setTimeout(() => syncPlayback(true), 1500);
          }
        }
      });
    }

    function disableCaptions() {
      if (!ytPlayer || !playerReady) return;
      try {
        if (typeof ytPlayer.unloadModule === 'function') {
          ytPlayer.unloadModule('captions');
          ytPlayer.unloadModule('cc');
        }
        if (typeof ytPlayer.setOption === 'function') {
          ytPlayer.setOption('captions', 'track', {});
          ytPlayer.setOption('cc', 'track', {});
        }
      } catch (_) {}
    }

    function clearLiveStreamState() {
      liveStreamInfo = {
        videoId: null,
        title: '',
        startTimeSec: null,
        isLiveNow: false,
        isUpcoming: false
      };
      liveEdgeWallOriginSec = null;
      currentPlayingId = null;
      currentPlayingType = null;
      renderEpgGrid();
      syncPlayback(true);
    }

    // 4. プレイヤー操作（再生/一時停止・画質選択・全画面表示・タップ時HUD表示）
    function handleViewportTap() {
      const vp = document.getElementById('video-viewport');
      vp.classList.add('hud-visible');
      if (hudTimer) clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        vp.classList.remove('hud-visible');
      }, 3200);

      if (!isMuted && ytPlayer && playerReady) {
        try {
          if (ytPlayer.isMuted()) {
            ytPlayer.unMute();
            ytPlayer.setVolume(100);
            updateAudioIcon();
          }
        } catch (_) {}
      }
    }

    function togglePlayPause() {
      if (!ytPlayer || !playerReady) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
        userPaused = true;
        ytPlayer.pauseVideo();
        updatePlayPauseIcon(true);
      } else {
        userPaused = false;
        ytPlayer.playVideo();
        updatePlayPauseIcon(false);
      }
    }

    function updatePlayPauseIcon(paused) {
      document.getElementById('icon-play').classList.toggle('hidden', !paused);
      document.getElementById('icon-pause').classList.toggle('hidden', paused);
    }

    function changeVideoQuality(q) {
      selectedQuality = q;
      if (!ytPlayer || !playerReady) return;
      try {
        ytPlayer.setPlaybackQuality(q);
      } catch (_) {}
    }

    function toggleFullscreen() {
      const vp = document.getElementById('video-viewport');
      if (!document.fullscreenElement) {
        if (vp.requestFullscreen) vp.requestFullscreen();
        else if (vp.webkitRequestFullscreen) vp.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function toggleAudio() {
      if (!ytPlayer || !playerReady) return;
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
        isMuted = false;
      } else {
        ytPlayer.mute();
        isMuted = true;
      }
      updateAudioIcon();
    }

    function updateAudioIcon() {
      if (!ytPlayer || !playerReady) return;
      let muted = false;
      try { muted = ytPlayer.isMuted(); } catch (_) {}
      document.getElementById('icon-vol-on').classList.toggle('hidden', muted);
      document.getElementById('icon-vol-off').classList.toggle('hidden', !muted);
    }

    window.addEventListener('pointerdown', () => {
      if (!isMuted && ytPlayer && playerReady) {
        try {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
          updateAudioIcon();
        } catch (_) {}
      }
    }, { once: true });

    // 5. チャンネル切替・番組表表示切替・ライブチャット表示制御
    function switchChannel(ch) {
      activeChannel = ch;
      userPaused = false;
      const btn1 = document.getElementById('btn-ch1');
      const btn2 = document.getElementById('btn-ch2');

      if (ch === 1) {
        btn1.className = 'px-3 md:px-4 py-1.5 rounded-md text-xs font-bold transition bg-white text-black';
        btn2.className = 'px-3 md:px-4 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white';
      } else {
        btn2.className = 'px-3 md:px-4 py-1.5 rounded-md text-xs font-bold transition bg-white text-black';
        btn1.className = 'px-3 md:px-4 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white';
      }

      currentPlayingId = null;
      currentPlayingType = null;
      syncPlayback(true);
    }

    function toggleEpgSection() {
      epgVisible = !epgVisible;
      const section = document.getElementById('epg-section');
      const btn = document.getElementById('btn-epg-toggle');
      section.classList.toggle('hidden', !epgVisible);
      btn.className = epgVisible
        ? 'px-3 py-1.5 rounded-lg border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 text-xs font-bold text-zinc-200 transition'
        : 'px-3 py-1.5 rounded-lg border border-zinc-800 bg-zinc-950 hover:bg-zinc-900 text-xs font-bold text-zinc-500 transition';
    }

    // 視聴チャンネル1で「ライブ10分前（wait）」または「ライブ中（live）」の時のみチャットを表示し、終了したら非表示
    function updateLiveChatVisibility(slot) {
      const chatCol = document.getElementById('chat-column');
      const playerCol = document.getElementById('player-column');
      const chatFrame = document.getElementById('yt-chat-frame');

      const shouldShowChat = activeChannel === 1 && slot && (slot.type === 'wait' || slot.type === 'live');

      if (!shouldShowChat) {
        chatCol.classList.add('hidden');
        playerCol.className = 'lg:col-span-12 flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden';
        if (currentChatVideoId !== null) {
          chatFrame.src = 'about:blank';
          currentChatVideoId = null;
        }
        return;
      }

      chatCol.classList.remove('hidden');
      playerCol.className = 'lg:col-span-9 flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden';

      if (currentChatVideoId !== slot.id) {
        currentChatVideoId = slot.id;
        const domain = location.hostname || 'localhost';
        chatFrame.src = `https://www.youtube.com/live_chat?v=${encodeURIComponent(slot.id)}&embed_domain=${encodeURIComponent(domain)}&dark_theme=1`;
      }
    }

    // 6. リアルタイム再生同期・10分前待機・本番ライブ追いつき（倍速＆30秒スキップ）
    function formatHM(sec) {
      const d = new Date(sec * 1000);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function syncPlayback(forceLoad = false) {
      const nowSec = Date.now() / 1000;
      const slot = getCurrentSlot(activeChannel, nowSec);
      if (!slot) return;

      const standbyOverlay = document.getElementById('standby-overlay');
      const countdownEl = document.getElementById('standby-countdown');
      const titleEl = document.getElementById('current-title');
      const thumbEl = document.getElementById('current-thumb');
      const timeRangeEl = document.getElementById('current-time-range');
      const lagEl = document.getElementById('lag-seconds');

      // タイトル・サムネイル・時刻の同期
      titleEl.textContent = slot.title;
      thumbEl.src = slot.thumb;
      timeRangeEl.textContent = `${formatHM(slot.startSec)} - ${formatHM(slot.endSec)}`;

      // チャット表示制御（CH1のライブ10分前〜ライブ終了まで表示）
      updateLiveChatVisibility(slot);

      // 【ライブ開始前の動作】視聴チャンネル1の開始10分前〜本番ライブ開始までの待機画面
      if (activeChannel === 1 && slot.type === 'wait') {
        standbyOverlay.classList.remove('hidden');
        const targetStart = slot.scheduledStartSec || slot.endSec;
        const remain = Math.max(0, Math.ceil(targetStart - nowSec));
        const m = String(Math.floor(remain / 60)).padStart(2, '0');
        const s = String(remain % 60).padStart(2, '0');
        countdownEl.textContent = `${m}:${s}`;
        lagEl.textContent = '0.0';

        // 通常動画が流れていたら完全に停止する
        if (playerReady && ytPlayer && currentPlayingId !== null) {
          try { ytPlayer.stopVideo(); } catch (_) {}
          currentPlayingId = null;
          currentPlayingType = null;
        }

        // 待機中は10秒おきにライブ開始を自動チェックし、始まった瞬間にライブ再生へ切り替える
        if (Date.now() - lastStandbyPollMs > 10000) {
          lastStandbyPollMs = Date.now();
          checkLiveStatusOnly();
        }
        return;
      }

      standbyOverlay.classList.add('hidden');
      if (!playerReady || !ytPlayer) return;

      const targetOffset = Math.max(0, nowSec - slot.startSec);

      // 動画またはライブ枠への切り替え
      if (forceLoad || currentPlayingId !== slot.id || currentPlayingType !== slot.type) {
        currentPlayingId = slot.id;
        currentPlayingType = slot.type;
        userPaused = false;
        lastLoadOrSeekMs = Date.now();

        if (slot.type === 'live') {
          // ライブ配信は startSeconds を指定せずに読み込み、YouTubeの最新ライブエッジから再生する
          liveEdgeWallOriginSec = null;
          ytPlayer.loadVideoById(slot.id);
        } else {
          ytPlayer.loadVideoById({
            videoId: slot.id,
            startSeconds: Math.floor(targetOffset),
            suggestedQuality: selectedQuality
          });
        }

        disableCaptions();
        if (!isMuted) {
          try {
            ytPlayer.unMute();
            ytPlayer.setVolume(100);
          } catch (_) {}
        }
        return;
      }

      const state = typeof ytPlayer.getPlayerState === 'function' ? ytPlayer.getPlayerState() : -1;

      // 読み込み直後やバッファリング中は強制シークを行わない（無限バッファリング防止）
      if (state === YT.PlayerState.BUFFERING || state === YT.PlayerState.UNSTARTED) {
        return;
      }

      const playerTime = typeof ytPlayer.getCurrentTime === 'function' ? ytPlayer.getCurrentTime() : 0;
      const realDuration = typeof ytPlayer.getDuration === 'function' ? ytPlayer.getDuration() : 0;

      // 【ライブが行われているときの動作】遅延計測＆倍速・30秒スキップ追いつき制御
      if (slot.type === 'live') {
        if (playerTime > 0) {
          if (liveEdgeWallOriginSec === null) {
            liveEdgeWallOriginSec = nowSec - playerTime;
          } else {
            const currentExpected = nowSec - liveEdgeWallOriginSec;
            // プレイヤー位置が基準より先に進んだ場合は最新位置を新しいライブエッジとして更新
            if (playerTime > currentExpected) {
              liveEdgeWallOriginSec = nowSec - playerTime;
            }
            // DVRバッファ終端(realDuration)が基準より大きく進んでいる場合も補正
            if (realDuration > 0 && realDuration - currentExpected > 12) {
              const calibratedEdge = Math.max(playerTime, realDuration - 2);
              liveEdgeWallOriginSec = nowSec - calibratedEdge;
            }
          }
        }

        const expectedLiveEdge = liveEdgeWallOriginSec !== null ? (nowSec - liveEdgeWallOriginSec) : playerTime;
        const lag = Math.max(0, expectedLiveEdge - playerTime);
        lagEl.textContent = lag.toFixed(1);

        if (userPaused) return;

        if (state !== YT.PlayerState.PLAYING) {
          ytPlayer.playVideo();
        }

        // 30秒以上遅れていたら最新ライブ位置まで即スキップ
        if (lag >= 30 && Date.now() - lastLoadOrSeekMs > 4000) {
          lastLoadOrSeekMs = Date.now();
          const seekTarget = realDuration > expectedLiveEdge ? Math.max(expectedLiveEdge, realDuration - 2) : expectedLiveEdge;
          ytPlayer.seekTo(seekTarget, true);
          ytPlayer.setPlaybackRate(1.0);
        } else if (lag > 2.0) {
          // 遅れていたら倍速再生でライブ位置まで戻す
          if (ytPlayer.getPlaybackRate() !== 1.5) {
            ytPlayer.setPlaybackRate(1.5);
          }
        } else if (lag <= 0.8) {
          // ライブ位置に追いついたら等倍に戻す
          if (ytPlayer.getPlaybackRate() !== 1.0) {
            ytPlayer.setPlaybackRate(1.0);
          }
        }
        return;
      }

      // 【通常動画の同期・追いつき制御】
      const lag = Math.max(0, targetOffset - playerTime);
      lagEl.textContent = lag.toFixed(1);

      if (userPaused) return;

      if (state !== YT.PlayerState.PLAYING) {
        ytPlayer.playVideo();
      }

      if (lag >= 30 && Date.now() - lastLoadOrSeekMs > 4000) {
        lastLoadOrSeekMs = Date.now();
        ytPlayer.seekTo(targetOffset, true);
        ytPlayer.setPlaybackRate(1.0);
      } else if (lag > 2.5) {
        if (ytPlayer.getPlaybackRate() !== 1.5) {
          ytPlayer.setPlaybackRate(1.5);
        }
      } else if (targetOffset - playerTime < -4 && Date.now() - lastLoadOrSeekMs > 4000) {
        lastLoadOrSeekMs = Date.now();
        ytPlayer.seekTo(targetOffset, true);
        ytPlayer.setPlaybackRate(1.0);
      } else if (lag <= 0.8) {
        if (ytPlayer.getPlaybackRate() !== 1.0) {
          ytPlayer.setPlaybackRate(1.0);
        }
      }
    }

    // 7. 3日間対応のリアルなテレビ番組表 (EPG) 描画
    function getDayStartUnixSec(dayOffset) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + dayOffset);
      return Math.floor(d.getTime() / 1000);
    }

    function renderEpgDayTabs() {
      const container = document.getElementById('epg-day-tabs');
      const weekNames = ['日', '月', '火', '水', '木', '金', '土'];
      container.innerHTML = '';

      for (let i = 0; i < 3; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const label = `${d.getMonth() + 1}/${d.getDate()}(${weekNames[d.getDay()]})`;
        const btn = document.createElement('button');
        btn.className = i === selectedDayOffset
          ? 'px-3 py-1 rounded text-xs font-bold bg-white text-black transition'
          : 'px-3 py-1 rounded text-xs font-bold text-zinc-400 hover:text-white transition';
        btn.textContent = label;
        btn.onclick = () => {
          selectedDayOffset = i;
          renderEpgDayTabs();
          renderEpgGrid();
        };
        container.appendChild(btn);
      }
    }

    function renderEpgGrid() {
      const timeCol = document.getElementById('epg-time-col');
      const ch1Col = document.getElementById('epg-ch1-col');
      const ch2Col = document.getElementById('epg-ch2-col');

      if (timeCol.children.length === 0) {
        let timeHtml = '';
        for (let h = 0; h < 24; h++) {
          let bandClass = 'night';
          if (h >= 5 && h < 11) bandClass = 'morning';
          else if (h >= 11 && h < 18) bandClass = 'daytime';
          else if (h >= 18 && h < 23) bandClass = 'prime';
          timeHtml += `<div class="epg-hour-cell ${bandClass}">${h}</div>`;
        }
        timeCol.innerHTML = timeHtml;
      }

      const dayStartSec = getDayStartUnixSec(selectedDayOffset);
      const dayEndSec = dayStartSec + 86400;
      const nowSec = Date.now() / 1000;

      const ch1Slots = getScheduleSlots(1, dayStartSec, dayEndSec);
      const ch2Slots = getScheduleSlots(2, dayStartSec, dayEndSec);

      ch1Col.innerHTML = buildChannelColumnHtml(ch1Slots, dayStartSec, dayEndSec, nowSec);
      ch2Col.innerHTML = buildChannelColumnHtml(ch2Slots, dayStartSec, dayEndSec, nowSec);

      updateNowBar();
    }

    function buildChannelColumnHtml(slots, dayStartSec, dayEndSec, nowSec) {
      let html = '';
      for (const s of slots) {
        const clampedStart = Math.max(dayStartSec, s.startSec);
        const clampedEnd = Math.min(dayEndSec, s.endSec);
        const topPx = ((clampedStart - dayStartSec) / 60) * PX_PER_MINUTE;
        const heightPx = Math.max(20, ((clampedEnd - clampedStart) / 60) * PX_PER_MINUTE);

        const startDate = new Date(s.startSec * 1000);
        const minStr = String(startDate.getMinutes()).padStart(2, '0');
        const isCurrent = nowSec >= s.startSec && nowSec < s.endSec;

        let extraClass = '';
        if (s.type === 'live') extraClass = 'live-slot';
        else if (s.type === 'wait') extraClass = 'wait-slot';
        else if (isCurrent) extraClass = 'active-program';

        const showThumb = heightPx >= 36;

        html += `
          <div class="epg-program-item ${extraClass}" style="top:${topPx}px; height:${heightPx}px;">
            <span class="text-[11px] font-mono font-bold text-sky-400 shrink-0 leading-tight">${minStr}</span>
            ${showThumb ? `<img src="${s.thumb}" alt="" loading="lazy" class="w-12 h-7 object-cover rounded bg-zinc-900 shrink-0 mt-0.5" />` : ''}
            <div class="text-xs font-medium text-zinc-100 leading-snug line-clamp-2 break-all">${escapeHtml(s.title)}</div>
          </div>
        `;
      }
      return html;
    }

    function updateNowBar() {
      const nowBar = document.getElementById('epg-now-bar');
      if (selectedDayOffset !== 0) {
        nowBar.classList.add('hidden');
        return;
      }
      const dayStartSec = getDayStartUnixSec(0);
      const nowSec = Date.now() / 1000;
      const topPx = ((nowSec - dayStartSec) / 60) * PX_PER_MINUTE;
      nowBar.style.top = `${topPx}px`;
      nowBar.classList.remove('hidden');
    }

    function scrollToCurrentTime() {
      if (selectedDayOffset !== 0) {
        selectedDayOffset = 0;
        renderEpgDayTabs();
        renderEpgGrid();
      }
      const scroller = document.getElementById('epg-scroll');
      const dayStartSec = getDayStartUnixSec(0);
      const nowSec = Date.now() / 1000;
      const topPx = ((nowSec - dayStartSec) / 60) * PX_PER_MINUTE;
      scroller.scrollTo({
        top: Math.max(0, topPx - 140),
        behavior: 'smooth'
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 8. @takaneko_ch のライブ配信枠（予約枠・配信中）および新規動画の高精度検知
    function parseDurationText(text) {
      if (!text) return 0;
      const parts = text.trim().split(':').map(Number);
      if (parts.some(isNaN)) return 0;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 0;
    }

    // 複数プロキシを並列実行して最速のレスポンスを取得（キャッシュ回避付き）
    async function fetchTextFast(targetUrl) {
      const sep = targetUrl.includes('?') ? '&' : '?';
      const bustUrl = `${targetUrl}${sep}_cb=${Date.now()}`;

      const fetchVia = async (proxyUrl, isJsonWrapped = false) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6500);
        try {
          const res = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
          clearTimeout(timer);
          if (!res.ok) throw new Error('status ' + res.status);
          const text = isJsonWrapped ? (await res.json()).contents : await res.text();
          if (!text || text.length < 500) throw new Error('empty');
          return text;
        } catch (err) {
          clearTimeout(timer);
          throw err;
        }
      };

      try {
        return await Promise.any([
          fetchVia(`https://corsproxy.io/?url=${encodeURIComponent(bustUrl)}`, false),
          fetchVia(`https://api.allorigins.win/get?url=${encodeURIComponent(bustUrl)}`, true),
          fetchVia(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(bustUrl)}`, false),
          fetchVia(`https://api.allorigins.win/raw?url=${encodeURIComponent(bustUrl)}`, false)
        ]);
      } catch (_) {
        return null;
      }
    }

    // 巨大HTMLから波括弧の対応を正確に辿ってJSONオブジェクトを抽出
    function extractJsonVariable(html, varName) {
      if (!html) return null;
      const markers = [
        `var ${varName} = `,
        `window["${varName}"] = `,
        `${varName} = `
      ];
      for (const marker of markers) {
        const idx = html.indexOf(marker);
        if (idx === -1) continue;
        const start = html.indexOf('{', idx + marker.length);
        if (start === -1) continue;
        let depth = 0;
        let inString = false;
        let escaped = false;
        for (let i = start; i < html.length; i++) {
          const ch = html[i];
          if (inString) {
            if (escaped) {
              escaped = false;
            } else if (ch === '\\') {
              escaped = true;
            } else if (ch === '"') {
              inString = false;
            }
          } else {
            if (ch === '"') {
              inString = true;
            } else if (ch === '{') {
              depth++;
            } else if (ch === '}') {
              depth--;
              if (depth === 0) {
                try {
                  return JSON.parse(html.slice(start, i + 1));
                } catch (_) {
                  break;
                }
              }
            }
          }
        }
      }
      return null;
    }

    function collectVideoRenderers(obj, results = []) {
      if (!obj || typeof obj !== 'object') return results;
      if ((obj.videoRenderer && obj.videoRenderer.videoId) || (obj.gridVideoRenderer && obj.gridVideoRenderer.videoId)) {
        results.push(obj.videoRenderer || obj.gridVideoRenderer);
        return results;
      }
      for (const key of Object.keys(obj)) {
        collectVideoRenderers(obj[key], results);
      }
      return results;
    }

    // /live または watch?v= のHTMLからライブ/予約枠の詳細を抽出
    function parseWatchOrLiveHtml(html) {
      if (!html) return null;
      const playerResp = extractJsonVariable(html, 'ytInitialPlayerResponse');
      const vd = playerResp?.videoDetails || {};
      const mf = playerResp?.microformat?.playerMicroformatRenderer || {};
      const lbd = mf?.liveBroadcastDetails || null;
      const slate = playerResp?.playabilityStatus?.liveStreamability?.liveStreamabilityRenderer?.offlineSlate?.liveStreamOfflineSlateRenderer || null;

      const canonicalId = html.match(/<link rel="canonical" href="https:\/\/www\.youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})"/)?.[1];
      const videoId = vd.videoId || canonicalId || null;
      if (!videoId) return null;

      const hasEndTimestamp = Boolean(lbd?.endTimestamp) || /"endTimestamp"\s*:\s*"[^"]+"/.test(html);
      const isLiveNow = Boolean(
        (lbd && lbd.isLiveNow === true) ||
        /"isLiveNow"\s*:\s*true/.test(html) ||
        (vd.isLive === true && !vd.isUpcoming && !slate && !hasEndTimestamp)
      );
      const isUpcoming = Boolean(
        !isLiveNow && !hasEndTimestamp && (
          vd.isUpcoming === true ||
          Boolean(slate) ||
          /"isUpcoming"\s*:\s*true/.test(html) ||
          /"scheduledStartTime"\s*:\s*"\d+"/.test(html) ||
          (lbd && lbd.isLiveNow === false)
        )
      );

      if (!isLiveNow && !isUpcoming) return null;

      let startTimeSec = null;
      const slateStart = slate?.scheduledStartTime || (html.match(/"scheduledStartTime"\s*:\s*"(\d+)"/)?.[1]);
      const isoStart = lbd?.startTimestamp || (html.match(/"startTimestamp"\s*:\s*"([^"]+)"/)?.[1]);

      if (slateStart) {
        startTimeSec = Number(slateStart);
      } else if (isoStart) {
        const parsed = Date.parse(isoStart);
        if (!isNaN(parsed)) startTimeSec = Math.floor(parsed / 1000);
      }

      if (!startTimeSec) {
        startTimeSec = Math.floor(Date.now() / 1000) - (isLiveNow ? 60 : -600);
      }

      const title = vd.title ||
        mf.title?.simpleText ||
        (html.match(/<meta name="title" content="([^"]+)">/)?.[1]) ||
        'たかねこちゃんねる ライブ';

      return {
        videoId,
        title,
        startTimeSec,
        isLiveNow,
        isUpcoming
      };
    }

    function applyDetectedLiveInfo(detected) {
      const prevId = liveStreamInfo.videoId;
      const prevLiveNow = liveStreamInfo.isLiveNow;
      const prevUpcoming = liveStreamInfo.isUpcoming;
      const prevStart = liveStreamInfo.startTimeSec;

      if (!detected) {
        if (prevId) {
          clearLiveStreamState();
        }
        return;
      }

      liveStreamInfo = {
        videoId: detected.videoId,
        title: detected.title || 'たかねこちゃんねる ライブ',
        startTimeSec: detected.startTimeSec,
        isLiveNow: Boolean(detected.isLiveNow),
        isUpcoming: Boolean(detected.isUpcoming)
      };

      const changed =
        prevId !== liveStreamInfo.videoId ||
        prevLiveNow !== liveStreamInfo.isLiveNow ||
        prevUpcoming !== liveStreamInfo.isUpcoming ||
        prevStart !== liveStreamInfo.startTimeSec;

      if (changed) {
        renderEpgGrid();
        syncPlayback(prevLiveNow !== liveStreamInfo.isLiveNow || prevId !== liveStreamInfo.videoId);
      }
    }

    // ライブ配信状態のみを高速チェック（待機中や定期ポーリング用）
    async function checkLiveStatusOnly() {
      if (isCheckingLive) return;
      isCheckingLive = true;

      try {
        // URLパラメータでのテスト指定 (?live=VIDEO_ID&start=UNIX_SEC&status=wait|live)
        const params = new URLSearchParams(location.search);
        if (params.get('live')) {
          const nowSec = Math.floor(Date.now() / 1000);
          const startSec = params.get('start') ? Number(params.get('start')) : nowSec - 30;
          const forcedStatus = params.get('status');
          const isLiveNow = forcedStatus === 'live' ? true : (forcedStatus === 'wait' ? false : nowSec >= startSec);
          applyDetectedLiveInfo({
            videoId: params.get('live'),
            title: params.get('title') || 'たかねこちゃんねる ライブ',
            startTimeSec: startSec,
            isLiveNow: isLiveNow,
            isUpcoming: !isLiveNow
          });
          isCheckingLive = false;
          return;
        }

        // 1) @takaneko_ch/live と @takaneko_ch/streams を並列取得
        const [liveHtml, streamsHtml] = await Promise.all([
          fetchTextFast(`https://www.youtube.com/${CHANNEL_HANDLE}/live?hl=ja`),
          fetchTextFast(`https://www.youtube.com/${CHANNEL_HANDLE}/streams?hl=ja`)
        ]);

        // A. まず /live ページの ytInitialPlayerResponse から判定
        const directLive = parseWatchOrLiveHtml(liveHtml);
        if (directLive && directLive.isLiveNow) {
          applyDetectedLiveInfo(directLive);
          isCheckingLive = false;
          return;
        }

        // B. /streams タブの一覧から「現在ライブ中」と「配信予定(予約枠)」を探索
        let activeCandidate = null;
        const upcomingCandidates = [];

        const streamsData = extractJsonVariable(streamsHtml, 'ytInitialData') || extractJsonVariable(liveHtml, 'ytInitialData');
        if (streamsData) {
          const streamRenderers = collectVideoRenderers(streamsData);
          const nowSec = Math.floor(Date.now() / 1000);

          for (const sr of streamRenderers) {
            const vid = sr.videoId;
            if (!vid) continue;
            const title = sr.title?.runs?.map(r => r.text).join('') || sr.title?.simpleText || 'たかねこちゃんねる ライブ';
            const badgesStr = JSON.stringify(sr.badges || []) + JSON.stringify(sr.thumbnailOverlays || []);
            const viewStr = JSON.stringify(sr.viewCountText || {});

            const hasLiveBadge =
              badgesStr.includes('BADGE_STYLE_TYPE_LIVE_NOW') ||
              badgesStr.includes('"style":"LIVE"') ||
              viewStr.includes('視聴中') ||
              viewStr.includes('watching');

            if (hasLiveBadge && !sr.upcomingEventData) {
              activeCandidate = {
                videoId: vid,
                title,
                startTimeSec: (liveStreamInfo.videoId === vid && liveStreamInfo.startTimeSec) ? liveStreamInfo.startTimeSec : nowSec - 60,
                isLiveNow: true,
                isUpcoming: false
              };
              break;
            }

            if (sr.upcomingEventData && sr.upcomingEventData.startTime) {
              const startSec = Number(sr.upcomingEventData.startTime);
              // 古すぎる放置枠（開始予定から6時間以上経過）は除外
              if (startSec > nowSec - 21600) {
                upcomingCandidates.push({
                  videoId: vid,
                  title,
                  startTimeSec: startSec,
                  isLiveNow: false,
                  isUpcoming: true
                });
              }
            }
          }
        }

        // 現在ライブ中の枠が見つかった場合、watchページから正確な開始時刻も取得して反映
        if (activeCandidate) {
          const watchHtml = await fetchTextFast(`https://www.youtube.com/watch?v=${activeCandidate.videoId}&hl=ja`);
          const detailed = parseWatchOrLiveHtml(watchHtml);
          applyDetectedLiveInfo(detailed || activeCandidate);
          isCheckingLive = false;
          return;
        }

        // /live で予約枠が見つかった場合
        if (directLive && directLive.isUpcoming) {
          applyDetectedLiveInfo(directLive);
          isCheckingLive = false;
          return;
        }

        // /streams で予約枠が見つかった場合（最も開始時刻が近い枠を選択）
        if (upcomingCandidates.length > 0) {
          upcomingCandidates.sort((a, b) => a.startTimeSec - b.startTimeSec);
          const nearest = upcomingCandidates[0];
          // 開始10分前以内に入っている場合はwatchページで実際に始まったかどうかも最終確認
          const nowSec = Math.floor(Date.now() / 1000);
          if (nowSec >= nearest.startTimeSec - 600) {
            const watchHtml = await fetchTextFast(`https://www.youtube.com/watch?v=${nearest.videoId}&hl=ja`);
            const detailed = parseWatchOrLiveHtml(watchHtml);
            applyDetectedLiveInfo(detailed || nearest);
          } else {
            applyDetectedLiveInfo(nearest);
          }
          isCheckingLive = false;
          return;
        }

        // ライブ中も予約枠も存在しない場合（配信終了後）
        if (liveHtml || streamsHtml) {
          applyDetectedLiveInfo(null);
        }
      } catch (_) {}

      isCheckingLive = false;
    }

    // 通常動画カタログの更新（ライブアーカイブ・Podcastを除く新着動画の自動追加）
    async function refreshChannelVideos() {
      const videosHtml = await fetchTextFast(`https://www.youtube.com/${CHANNEL_HANDLE}/videos?hl=ja`);
      const videosData = extractJsonVariable(videosHtml, 'ytInitialData');
      if (!videosData) return;

      const renderers = collectVideoRenderers(videosData);
      const existingIds = new Set(videoCatalog.map(v => v.id));
      let added = false;

      for (const vr of renderers) {
        const vid = vr.videoId;
        if (!vid || existingIds.has(vid)) continue;

        const badgesStr = JSON.stringify(vr.badges || []) + JSON.stringify(vr.thumbnailOverlays || []);
        const isLiveOrUpcoming = badgesStr.includes('"LIVE"') || badgesStr.includes('BADGE_STYLE_TYPE_LIVE_NOW') || Boolean(vr.upcomingEventData);
        if (isLiveOrUpcoming) continue;

        const publishedText = vr.publishedTimeText?.simpleText || '';
        if (publishedText.includes('配信')) continue;

        const title = vr.title?.runs?.map(r => r.text).join('') || vr.title?.simpleText || '';
        const lenText = vr.lengthText?.simpleText ||
                        vr.thumbnailOverlays?.find(o => o.thumbnailOverlayTimeStatusRenderer)?.thumbnailOverlayTimeStatusRenderer?.text?.simpleText;
        const duration = parseDurationText(lenText);

        if (title && duration > 0 && !isExcludedVideo(title, duration)) {
          existingIds.add(vid);
          videoCatalog.push({
            id: vid,
            title,
            duration,
            thumb: `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`
          });
          added = true;
        }
      }

      if (added) {
        renderEpgGrid();
      }
    }

    // 9. 初期描画と定期タイマー起動
    function tickClock() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${hh}:${mm}:${ss}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      tickClock();
      renderEpgDayTabs();
      renderEpgGrid();
      syncPlayback(false);
      scrollToCurrentTime();

      // 最優先でライブ枠・予約枠をチェックし、並行して動画一覧も更新
      checkLiveStatusOnly();
      refreshChannelVideos();

      setInterval(() => {
        tickClock();
        syncPlayback(false);
        updateNowBar();
      }, 1000);

      setInterval(() => {
        renderEpgGrid();
      }, 60000);

      // 30秒ごとにライブ枠（枠立て・開始・終了）を定期チェック
      setInterval(() => {
        checkLiveStatusOnly();
      }, 30000);

      // 5分ごとに新着動画をチェック
      setInterval(() => {
        refreshChannelVideos();
      }, 300000);
    });
  </script>
