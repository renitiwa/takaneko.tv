<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAKANEKO.TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* YouTubeネイティブUI完全非表示用ビューポート */
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .video-viewport:fullscreen,
    .video-viewport:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
    }
    .video-crop-wrapper {
      position: absolute;
      top: -68px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 136px);
      pointer-events: none;
    }
    .video-crop-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    /* カスタムプレイヤーオーバーレイ */
    .player-overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.25) 28%, transparent 60%);
      opacity: 0;
      transition: opacity 0.22s ease;
      pointer-events: none;
    }
    .player-overlay.visible {
      opacity: 1;
    }
    .player-overlay.visible .player-controls-bar {
      pointer-events: auto;
    }

    /* リアルなテレビ番組表 (EPG / ラテ欄) */
    .epg-scroll-container {
      position: relative;
      height: 540px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #101114;
      border-top: 1px solid #27272a;
    }
    .epg-header-row {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 52px 1fr 1fr;
      background: #18181b;
      border-bottom: 2px solid #27272a;
    }
    .epg-body-grid {
      position: relative;
      display: grid;
      grid-template-columns: 52px 1fr 1fr;
      height: 4320px; /* 24時間 × 180px (1分 = 3px) */
    }
    .epg-time-axis {
      background: #141417;
      border-right: 1px solid #27272a;
      position: relative;
    }
    .epg-hour-cell {
      height: 180px;
      border-bottom: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #a1a1aa;
    }
    .epg-hour-cell.morning { background: rgba(56, 189, 248, 0.04); }
    .epg-hour-cell.daytime { background: rgba(250, 204, 21, 0.04); }
    .epg-hour-cell.prime   { background: rgba(244, 63, 94, 0.05); }
    .epg-hour-cell.night   { background: rgba(99, 102, 241, 0.04); }

    .epg-channel-col {
      position: relative;
      border-right: 1px solid #27272a;
      background-image: linear-gradient(to bottom, #1f2025 1px, transparent 1px);
      background-size: 100% 180px;
    }
    .epg-program-item {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px solid #27272a;
      padding: 4px 8px;
      overflow: hidden;
      background: #131418;
      transition: background 0.15s;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .epg-program-item:hover {
      background: #1c1e24;
      z-index: 10;
    }
    .epg-program-item.active-program {
      background: #1c2433;
      border-left: 3px solid #38bdf8;
    }
    .epg-program-item.live-slot {
      background: #2b1419;
      border-left: 3px solid #ef4444;
    }
    .epg-program-item.wait-slot {
      background: #262012;
      border-left: 3px solid #f59e0b;
    }

    /* 現在時刻の赤線 */
    .epg-now-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ef4444;
      z-index: 25;
      pointer-events: none;
    }
    .epg-now-line::before {
      content: "";
      position: absolute;
      left: 47px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- メインコンテンツ -->
  <main class="max-w-[1600px] w-full mx-auto p-4 flex-1 flex flex-col gap-4">
    <div id="stage-grid" class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

        <div id="video-viewport" class="video-viewport">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />

            <p class="text-lg md:text-2xl font-bold text-white tracking-wide">
              配信が開始されるまでお待ちください

            <div id="standby-countdown" class="mt-3 text-2xl md:text-4xl font-mono font-black text-zinc-300 tabular-nums"></div>
          </div>
        </div>

        <!-- 現在再生している番組タイトル・時刻バー -->
        <div class="px-4 py-3 bg-zinc-950 border-t border-zinc-900 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <img
              id="current-thumb"
              src="https://i.ytimg.com/vi/Pt3oGNBTwjY/mqdefault.jpg"

        </div>
      </div>

      <!-- YouTubeライブチャット（視聴チャンネル1の10分前待機〜ライブ終了までのみ表示） -->
      <div id="chat-column" class="hidden lg:col-span-3 w-full">
        <div class="bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden h-[380px] lg:h-[520px]">
          <iframe

    </div>

    <!-- 3日間テレビ番組表 (EPG) -->
    <section id="epg-section" class="flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden">
      <div class="px-3 py-2 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
        <div id="epg-day-tabs" class="flex items-center gap-1"></div>
        <button onclick="scrollToCurrentTime()" class="px-3 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-zinc-200 transition">
          現在時刻

      <div id="epg-scroll" class="epg-scroll-container">
        <div class="epg-header-row">
          <div class="py-2.5 text-center text-[11px] font-bold text-zinc-400 border-r border-zinc-800">時刻</div>
          <div class="py-2.5 px-3 text-xs font-bold text-white border-r border-zinc-800">視聴チャンネル1</div>
          <div class="py-2.5 px-3 text-xs font-bold text-white">視聴チャンネル2</div>
        </div>

        <div id="epg-grid" class="epg-body-grid">
          <div id="epg-time-col" class="epg-time-axis"></div>
          <div id="epg-ch1-col" class="epg-channel-col"></div>
          <div id="epg-ch2-col" class="epg-channel-col"></div>
          <div id="epg-now-bar" class="epg-now-line hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CHANNEL_HANDLE = '@takaneko_ch';
    const EPOCH_BASE_SEC = Math.floor(new Date('2026-01-01T00:00:00+09:00').getTime() / 1000);
    const PX_PER_MINUTE = 3; // 1分 = 3px (1時間 = 180px, 24時間 = 4320px)

    // @takaneko_ch のライブ配信・ライブアーカイブを除く全通常動画カタログ（実在ID・正確なタイトル・正確な秒数）
    const SEED_VIDEOS = [
      { id: "Pt3oGNBTwjY", title: "【神ゲー】妹をわからせようとしたら逆にわからされた男の末路", duration: 1224 },
      { id: "UsDZmpYOMq4", title: "癒やし系ゲームかと思ったら即死リズムゲーだった件", duration: 1076 },
      { id: "Fg8F3SSV5BM", title: "たかねこPodcast #5　～カメレオンの振り返り～", duration: 1421 },
      { id: "NSvKJ61Kghw", title: "たかねこPodcast #4 ～過去動画を見よう～", duration: 1892 },
      { id: "mDYJiQEp5Cs", title: "たかねこPodcast #3.5 ～カメレオンでたびたび見かける変質者の正体を暴く！完結編～", duration: 1028 },
      { id: "bPsATeE0X28", title: "たかねこPodcast #3 ～カメレオンでたびたび見かける変質者の正体を暴く！その2～", duration: 2401 },
      { id: "W5ZfPdUveOc", title: "たかねこPodcast #2 ～カメレオンでたびたび見かける変質者の正体を暴く！～", duration: 2454 },
      { id: "G4uU482Z59Q", title: "たかねこPodcast #1 ～恋愛トークをしよう～", duration: 4677 },
      { id: "ovnGR7SjDmo", title: "たかねこPodcast #0 ～たかねこがリスナーからの質問に答える！～", duration: 5852 },
      { id: "LxdlnSgJrPk", title: "Endless laughter / たかねこちゃんねるBGM", duration: 119 },
      { id: "momFx-oGGJE", title: "【事故動画⁉️】酔っ払いゲーム実況者が酔っ払ったおっさんを帰宅させてみた🍺 【Drunken way to Home】", duration: 1116 },
      { id: "VYNkZsYU3jU", title: "【絶叫＆爆笑】しょぼんのアクション3D【バグった】", duration: 858 },
      { id: "Tqs77Nx2jZc", title: "【鬼畜クソゲー】しょぼんのアクション3D【今度は3D】", duration: 599 },
      { id: "AZKyFeUl-DM", title: "【大敗北】しょぼんのアクションHD【ラスト】", duration: 655 },
      { id: "XgRjc8CGP68", title: "【鬼畜クソゲー】しょぼんのアクションHD【このゲームヤバすぎ】", duration: 2372 },
      { id: "iMmfbGWZ40M", title: "【鬼畜クソゲー】しょぼんのアクションHD【終わりの始まり】", duration: 2013 }
    ];

    let videoCatalog = SEED_VIDEOS.map(v => ({
      ...v,
      thumb: `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`
    }));

    const brokenVideoIds = new Set();

    // ライブ配信枠の状態管理
    let liveStreamInfo = {
      videoId: null,
      title: '',
      startTimeSec: null,
      endTimeSec: null,
      isLiveNow: false
    };

    let activeChannel = 1;
    let selectedDayOffset = 0;
    let isEpgVisible = true;

    let ytPlayer = null;
    let playerReady = false;
    let currentPlayingId = null;
    let currentChatVideoId = null;

    let userRequestedMute = false;
    let userPaused = false;
    let selectedQuality = 'default';
    let overlayHideTimer = null;

    // 1. 全デバイス共通のシード付き乱数 (Mulberry32 + Fisher-Yates)
    function seededRandom(seed) {
      let t = (seed + 0x6D2B79F5) | 0;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function getActiveCatalog() {
      const list = videoCatalog.filter(v => !brokenVideoIds.has(v.id));
      return list.length > 0 ? list : videoCatalog;
    }

    function getDeterministicShuffle(list, cycleIndex, channelSalt) {
      const arr = [...list];
      let seed = (cycleIndex * 2654435761) ^ (channelSalt * 1597334677);
      for (let i = arr.length - 1; i > 0; i--) {
        seed = (seed + 1013904223) | 0;
        const j = Math.floor(seededRandom(seed) * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    // 2. 番組スケジュール算出（全端末で同じ時刻・同じ順番で同期）
    function getScheduleSlots(channelNum, rangeStartSec, rangeEndSec) {
      const catalog = getActiveCatalog();
      if (catalog.length === 0) return [];

      const totalCycleDuration = catalog.reduce((acc, v) => acc + v.duration, 0);
      if (totalCycleDuration <= 0) return [];

      const salt = channelNum === 1 ? 101 : 202;
      const startCycle = Math.floor((rangeStartSec - EPOCH_BASE_SEC) / totalCycleDuration) - 1;
      const endCycle = Math.floor((rangeEndSec - EPOCH_BASE_SEC) / totalCycleDuration) + 1;

      const slots = [];

      for (let cycle = startCycle; cycle <= endCycle; cycle++) {
        const shuffled = getDeterministicShuffle(catalog, cycle, salt);
        let cursor = EPOCH_BASE_SEC + cycle * totalCycleDuration;

        for (const video of shuffled) {
          const slotStart = cursor;
          const slotEnd = cursor + video.duration;
          cursor = slotEnd;

          if (slotEnd <= rangeStartSec || slotStart >= rangeEndSec) continue;

          slots.push({
            type: 'video',
            id: video.id,
            title: video.title,
            thumb: `https://i.ytimg.com/vi/${video.id}/mqdefault.jpg`,
            startSec: slotStart,
            endSec: slotEnd,
            duration: video.duration
          });
        }
      }

      // 視聴チャンネル1のみ、ライブ配信枠が存在する場合は10分前待機枠＋ライブ枠を上書き
      if (channelNum === 1 && liveStreamInfo.videoId && liveStreamInfo.startTimeSec) {
        const waitStart = liveStreamInfo.startTimeSec - 600;
        const liveStart = liveStreamInfo.startTimeSec;
        const liveEnd = liveStreamInfo.endTimeSec || (liveStreamInfo.startTimeSec + 7200);

        const merged = [];
        for (const s of slots) {
          if (s.endSec <= waitStart || s.startSec >= liveEnd) {
            merged.push(s);
          } else if (s.startSec < waitStart && s.endSec > waitStart) {
            merged.push({ ...s, endSec: waitStart, duration: waitStart - s.startSec });
          } else if (s.startSec < liveEnd && s.endSec > liveEnd) {
            merged.push({ ...s, startSec: liveEnd, duration: s.endSec - liveEnd });
          }
        }

        if (liveStart > rangeStartSec && waitStart < rangeEndSec) {
          merged.push({
            type: 'wait',
            id: liveStreamInfo.videoId,
            title: '配信が開始されるまでお待ちください',
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: waitStart,
            endSec: liveStart,
            duration: 600
          });
        }

        if (liveEnd > rangeStartSec && liveStart < rangeEndSec) {
          merged.push({
            type: 'live',
            id: liveStreamInfo.videoId,
            title: liveStreamInfo.title,
            thumb: `https://i.ytimg.com/vi/${liveStreamInfo.videoId}/mqdefault.jpg`,
            startSec: liveStart,
            endSec: liveEnd,
            duration: liveEnd - liveStart
          });
        }

        merged.sort((a, b) => a.startSec - b.startSec);
        return merged;
      }

      return slots;
    }

    function getCurrentSlot(channelNum, nowSec) {
      const slots = getScheduleSlots(channelNum, nowSec - 120, nowSec + 120);
      return slots.find(s => nowSec >= s.startSec && nowSec < s.endSec) || slots[0] || null;
    }

    // 3. YouTube IFrame Player API 初期化（UI非表示・字幕強制オフ・デフォルト音声オン）
    function loadYouTubeApi() {
      if (window.YT && window.YT.Player) {
        initYouTubePlayer();
        return;
      }
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function() {
      initYouTubePlayer();
    };

    function initYouTubePlayer() {
      if (ytPlayer) return;
      const nowSec = Date.now() / 1000;
      const initialSlot = getCurrentSlot(activeChannel, nowSec);
      const startId = initialSlot ? initialSlot.id : SEED_VIDEOS[0].id;
      const startOffset = initialSlot && initialSlot.type === 'video'
        ? Math.max(0, Math.floor(nowSec - initialSlot.startSec))
        : 0;

      currentPlayingId = startId;

      ytPlayer = new YT.Player('yt-player', {
        host: 'https://www.youtube-nocookie.com',
        width: '100%',
        height: '100%',
        videoId: startId,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          iv_load_policy: 3,
          cc_load_policy: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          start: startOffset,
          hl: 'ja'
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onApiChange: disableCaptions,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady(e) {
      playerReady = true;
      disableCaptions();
      applySelectedQuality();

      try {
        e.target.unMute();
        e.target.setVolume(100);
        e.target.playVideo();
      } catch (_) {}

      // 自動再生ポリシーによる停止を検知した場合は一時ミュートで再生を開始し、初回操作時に自動アンミュート
      setTimeout(() => {
        if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
        const st = ytPlayer.getPlayerState();
        if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING && !userPaused) {
          ytPlayer.mute();
          ytPlayer.playVideo();
        }
        updateAudioIcon();
        updatePlayPauseIcon();
      }, 800);

      syncPlayback(false);
    }

    function onPlayerStateChange(e) {
      disableCaptions();
      updateAudioIcon();
      updatePlayPauseIcon();

      if (e.data === YT.PlayerState.PLAYING) {
        applySelectedQuality();
      }

      const nowSec = Date.now() / 1000;
      const slot = getCurrentSlot(activeChannel, nowSec);

      if (slot && slot.type === 'wait' && activeChannel === 1) {
        if (e.data === YT.PlayerState.PLAYING) {
          ytPlayer.pauseVideo();
        }
        return;
      }

      if (e.data === YT.PlayerState.PAUSED) {
        if (!userPaused) {
          ytPlayer.playVideo();
        }
      } else if (e.data === YT.PlayerState.ENDED) {
        // ライブ配信枠が終了した場合はライブ情報をクリアして通常動画に戻し、チャットも非表示にする
        if (slot && slot.type === 'live') {
          liveStreamInfo.videoId = null;
          liveStreamInfo.startTimeSec = null;
          liveStreamInfo.endTimeSec = null;
          liveStreamInfo.isLiveNow = false;
          renderEpgGrid();
        }
        currentPlayingId = null;
        syncPlayback(true);
      }
    }

    function onPlayerError() {
      if (currentPlayingId) {
        brokenVideoIds.add(currentPlayingId);
        currentPlayingId = null;
        renderEpgGrid();
        syncPlayback(true);
      }
    }

    function disableCaptions() {
      if (!ytPlayer || !playerReady) return;
      try {
        if (typeof ytPlayer.unloadModule === 'function') {
          ytPlayer.unloadModule('captions');
          ytPlayer.unloadModule('cc');
        }
        if (typeof ytPlayer.setOption === 'function') {
          ytPlayer.setOption('captions', 'track', {});
          ytPlayer.setOption('cc', 'track', {});
        }
      } catch (_) {}
    }

    // 4. カスタムオーバーレイ操作（再生/一時停止・画質変更・全画面・音声・ホバー/タップ表示）
    function setupPlayerOverlayInteractions() {
      const viewport = document.getElementById('video-viewport');
      const shield = document.getElementById('interaction-shield');

      const showOverlayTemporarily = () => {
        const overlay = document.getElementById('player-overlay');
        overlay.classList.add('visible');
        if (overlayHideTimer) clearTimeout(overlayHideTimer);
        overlayHideTimer = setTimeout(() => {
          if (!userPaused) {
            overlay.classList.remove('visible');
          }
        }, 3000);
      };

      viewport.addEventListener('mousemove', showOverlayTemporarily);
      viewport.addEventListener('mouseenter', showOverlayTemporarily);
      viewport.addEventListener('mouseleave', () => {
        if (overlayHideTimer) clearTimeout(overlayHideTimer);
        if (!userPaused) {
          document.getElementById('player-overlay').classList.remove('visible');
        }
      });

      shield.addEventListener('click', (e) => {
        unlockAudioOnInteraction();
        const overlay = document.getElementById('player-overlay');
        if (!overlay.classList.contains('visible')) {
          showOverlayTemporarily();
        } else {
          togglePlayPause(e);
        }
      });

      document.addEventListener('fullscreenchange', updateFullscreenIcon);
      document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
    }

    function togglePlayPause(e) {
      if (e) e.stopPropagation();
      unlockAudioOnInteraction();
      if (!ytPlayer || !playerReady) return;

      const nowSec = Date.now() / 1000;
      const slot = getCurrentSlot(activeChannel, nowSec);
      if (activeChannel === 1 && slot && slot.type === 'wait') return;

      const state = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
        userPaused = true;
        ytPlayer.pauseVideo();
        document.getElementById('player-overlay').classList.add('visible');
      } else {
        userPaused = false;
        ytPlayer.playVideo();
        syncPlayback(false);
      }
      updatePlayPauseIcon();
    }

    function updatePlayPauseIcon() {
      const playIcon = document.getElementById('icon-play');
      const pauseIcon = document.getElementById('icon-pause');
      if (!ytPlayer || !playerReady || typeof ytPlayer.getPlayerState !== 'function') return;
      const state = ytPlayer.getPlayerState();
      const isPaused = userPaused || state === YT.PlayerState.PAUSED;
      playIcon.classList.toggle('hidden', !isPaused);
      pauseIcon.classList.toggle('hidden', isPaused);
    }

    function changeVideoQuality(quality, e) {
      if (e) e.stopPropagation();
      selectedQuality = quality;
      applySelectedQuality(true);
    }

    function applySelectedQuality(forceReloadIfNeeded = false) {
      if (!ytPlayer || !playerReady) return;
      try {
        if (typeof ytPlayer.setPlaybackQualityRange === 'function') {
          if (selectedQuality === 'default') {
            ytPlayer.setPlaybackQuality('default');
          } else {
            ytPlayer.setPlaybackQualityRange(selectedQuality, selectedQuality);
            ytPlayer.setPlaybackQuality(selectedQuality);
          }
        } else if (typeof ytPlayer.setPlaybackQuality === 'function') {
          ytPlayer.setPlaybackQuality(selectedQuality);
        }

        if (forceReloadIfNeeded && currentPlayingId && typeof ytPlayer.getCurrentTime === 'function') {
          const curTime = ytPlayer.getCurrentTime() || 0;
          ytPlayer.loadVideoById({
            videoId: currentPlayingId,
            startSeconds: curTime,
            suggestedQuality: selectedQuality
          });
          if (userPaused) {
            setTimeout(() => ytPlayer.pauseVideo(), 200);
          }
        }
      } catch (_) {}
    }

    function toggleFullscreen(e) {
      if (e) e.stopPropagation();
      const viewport = document.getElementById('video-viewport');
      const fsElement = document.fullscreenElement || document.webkitFullscreenElement;

      if (!fsElement) {
        if (viewport.requestFullscreen) {
          viewport.requestFullscreen();
        } else if (viewport.webkitRequestFullscreen) {
          viewport.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenIcon() {
      const fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      document.getElementById('icon-fs-enter').classList.toggle('hidden', !!fsElement);
      document.getElementById('icon-fs-exit').classList.toggle('hidden', !fsElement);
    }

    function unlockAudioOnInteraction() {
      if (!ytPlayer || !playerReady || userRequestedMute) return;
      try {
        if (ytPlayer.isMuted()) {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
          updateAudioIcon();
        }
      } catch (_) {}
    }

    ['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, unlockAudioOnInteraction, { passive: true });
    });

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      if (!ytPlayer || !playerReady) return;
      try {
        if (ytPlayer.isMuted()) {
          userRequestedMute = false;
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
        } else {
          userRequestedMute = true;
          ytPlayer.mute();
        }
        updateAudioIcon();
      } catch (_) {}
    }

    function updateAudioIcon() {
      if (!ytPlayer || !playerReady || typeof ytPlayer.isMuted !== 'function') return;
      const muted = ytPlayer.isMuted();
      document.getElementById('icon-vol-on').classList.toggle('hidden', muted);
      document.getElementById('icon-vol-off').classList.toggle('hidden', !muted);
    }

    // 5. チャンネル切り替え・番組表表示/非表示・ライブチャット表示制御
    function switchChannel(ch) {
      if (activeChannel === ch) return;
      activeChannel = ch;
      userPaused = false;

      const btn1 = document.getElementById('btn-ch1');
      const btn2 = document.getElementById('btn-ch2');

      if (ch === 1) {
        btn1.className = 'px-3.5 py-1.5 rounded-md text-xs font-bold transition bg-white text-black';
        btn2.className = 'px-3.5 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white';
      } else {
        btn2.className = 'px-3.5 py-1.5 rounded-md text-xs font-bold transition bg-white text-black';
        btn1.className = 'px-3.5 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white';
      }

      currentPlayingId = null;
      syncPlayback(true);
    }

    function toggleEpgSection() {
      isEpgVisible = !isEpgVisible;
      const epgSection = document.getElementById('epg-section');
      const btnEpg = document.getElementById('btn-epg-toggle');

      epgSection.classList.toggle('hidden', !isEpgVisible);
      if (isEpgVisible) {
        btnEpg.className = 'px-3.5 py-1.5 rounded-md text-xs font-bold transition bg-zinc-800 text-white hover:bg-zinc-700';
        scrollToCurrentTime();
      } else {
        btnEpg.className = 'px-3.5 py-1.5 rounded-md text-xs font-bold transition text-zinc-400 hover:text-white';
      }
    }

    // 視聴チャンネル1で「ライブ10分前待機」〜「ライブ配信終了」の間のみライブチャットを表示
    function updateChatVisibilityAndFrame(slot) {
      const chatCol = document.getElementById('chat-column');
      const playerCol = document.getElementById('player-column');
      const chatFrame = document.getElementById('yt-chat-frame');

      const shouldShowChat = activeChannel === 1 && slot && (slot.type === 'wait' || slot.type === 'live') && !!slot.id;

      if (shouldShowChat) {
        chatCol.classList.remove('hidden');
        playerCol.className = 'lg:col-span-9 flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden';
        if (currentChatVideoId !== slot.id) {
          currentChatVideoId = slot.id;
          const domain = location.hostname || 'localhost';
          chatFrame.src = `https://www.youtube.com/live_chat?v=${encodeURIComponent(slot.id)}&embed_domain=${encodeURIComponent(domain)}&dark_theme=1`;
        }
      } else {
        chatCol.classList.add('hidden');
        playerCol.className = 'lg:col-span-12 flex flex-col bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden';
        if (currentChatVideoId !== null) {
          chatFrame.src = 'about:blank';
          currentChatVideoId = null;
        }
      }
    }

    // 6. 再生同期・10分前待機・遅延秒数表示・倍速追いつき＆30秒以上スキップ
    function formatHM(sec) {
      const d = new Date(sec * 1000);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function syncPlayback(forceLoad = false) {
      const nowSec = Date.now() / 1000;
      const slot = getCurrentSlot(activeChannel, nowSec);
      if (!slot) return;

      const standbyOverlay = document.getElementById('standby-overlay');
      const countdownEl = document.getElementById('standby-countdown');
      const titleEl = document.getElementById('current-title');
      const thumbEl = document.getElementById('current-thumb');
      const timeRangeEl = document.getElementById('current-time-range');
      const delayDisplayEl = document.getElementById('delay-display');

      // タイトル・サムネイル・時刻を一致させて表示
      titleEl.textContent = slot.title;
      thumbEl.src = slot.thumb;
      timeRangeEl.textContent = `${formatHM(slot.startSec)} - ${formatHM(slot.endSec)}`;

      // ライブチャットの表示・非表示制御
      updateChatVisibilityAndFrame(slot);

      // 視聴チャンネル1の10分前待機表示
      if (activeChannel === 1 && slot.type === 'wait') {
        standbyOverlay.classList.remove('hidden');
        const remain = Math.max(0, Math.ceil(slot.endSec - nowSec));
        const m = String(Math.floor(remain / 60)).padStart(2, '0');
        const s = String(remain % 60).padStart(2, '0');
        countdownEl.textContent = `${m}:${s}`;
        delayDisplayEl.textContent = '遅延 0.0秒';

        if (playerReady && ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
          ytPlayer.pauseVideo();
        }
        currentPlayingId = null;
        return;
      }

      standbyOverlay.classList.add('hidden');
      if (!playerReady || !ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;

      const targetOffset = Math.max(0, nowSec - slot.startSec);

      // 番組切り替え時
      if (forceLoad || currentPlayingId !== slot.id) {
        currentPlayingId = slot.id;
        userPaused = false;
        ytPlayer.loadVideoById({
          videoId: slot.id,
          startSeconds: slot.type === 'live' ? undefined : Math.floor(targetOffset),
          suggestedQuality: selectedQuality
        });
        disableCaptions();
        applySelectedQuality();
        if (!userRequestedMute) {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
        }
        updatePlayPauseIcon();
        return;
      }

      // 理想再生位置と現在再生位置から遅延秒数を算出
      const realDuration = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      const playerTime = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : targetOffset;

      let idealTime = targetOffset;
      if (slot.type === 'live' && realDuration > 0) {
        idealTime = Math.max(0, realDuration - 1);
      } else if (slot.type === 'video' && realDuration > 0 && targetOffset >= realDuration - 0.5) {
        idealTime = Math.min(targetOffset, Math.max(0, realDuration - 0.5));
      }

      const rawLag = Math.max(0, idealTime - playerTime);
      delayDisplayEl.textContent = `遅延 ${rawLag.toFixed(1)}秒`;

      // ユーザーが一時停止している間は強制同期を行わない
      if (userPaused) {
        updatePlayPauseIcon();
        return;
      }

      const st = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
      if (st !== YT.PlayerState.PLAYING) return;

      disableCaptions();

      const signedLag = idealTime - playerTime;

      // 30秒以上遅れていたら即座に最新位置へスキップ、2.5秒〜30秒の遅れは1.5倍速で追いつく
      if (signedLag >= 30) {
        ytPlayer.seekTo(idealTime, true);
        ytPlayer.setPlaybackRate(1.0);
      } else if (signedLag > 2.5) {
        if (ytPlayer.getPlaybackRate() !== 1.5) {
          ytPlayer.setPlaybackRate(1.5);
        }
      } else if (signedLag < -4 && slot.type === 'video') {
        ytPlayer.seekTo(idealTime, true);
        ytPlayer.setPlaybackRate(1.0);
      } else if (signedLag <= 0.8) {
        if (ytPlayer.getPlaybackRate() !== 1.0) {
          ytPlayer.setPlaybackRate(1.0);
        }
      }
    }

    // 7. 3日間対応のテレビ番組表 (EPG) 描画
    function getDayStartUnixSec(dayOffset) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + dayOffset);
      return Math.floor(d.getTime() / 1000);
    }

    function renderEpgDayTabs() {
      const container = document.getElementById('epg-day-tabs');
      const weekNames = ['日', '月', '火', '水', '木', '金', '土'];
      container.innerHTML = '';

      for (let i = 0; i < 3; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const label = `${d.getMonth() + 1}/${d.getDate()}(${weekNames[d.getDay()]})`;
        const btn = document.createElement('button');
        btn.className = i === selectedDayOffset
          ? 'px-3 py-1 rounded text-xs font-bold bg-white text-black transition'
          : 'px-3 py-1 rounded text-xs font-bold text-zinc-400 hover:text-white transition';
        btn.textContent = label;
        btn.onclick = () => {
          selectedDayOffset = i;
          renderEpgDayTabs();
          renderEpgGrid();
        };
        container.appendChild(btn);
      }
    }

    function renderEpgGrid() {
      const timeCol = document.getElementById('epg-time-col');
      const ch1Col = document.getElementById('epg-ch1-col');
      const ch2Col = document.getElementById('epg-ch2-col');

      if (timeCol.children.length === 0) {
        let timeHtml = '';
        for (let h = 0; h < 24; h++) {
          let bandClass = 'night';
          if (h >= 5 && h < 11) bandClass = 'morning';
          else if (h >= 11 && h < 18) bandClass = 'daytime';
          else if (h >= 18 && h < 23) bandClass = 'prime';
          timeHtml += `<div class="epg-hour-cell ${bandClass}">${h}</div>`;
        }
        timeCol.innerHTML = timeHtml;
      }

      const dayStartSec = getDayStartUnixSec(selectedDayOffset);
      const dayEndSec = dayStartSec + 86400;
      const nowSec = Date.now() / 1000;

      const ch1Slots = getScheduleSlots(1, dayStartSec, dayEndSec);
      const ch2Slots = getScheduleSlots(2, dayStartSec, dayEndSec);

      ch1Col.innerHTML = buildChannelColumnHtml(ch1Slots, dayStartSec, dayEndSec, nowSec, 1);
      ch2Col.innerHTML = buildChannelColumnHtml(ch2Slots, dayStartSec, dayEndSec, nowSec, 2);

      updateNowBar();
    }

    function buildChannelColumnHtml(slots, dayStartSec, dayEndSec, nowSec, chNum) {
      let html = '';
      for (const s of slots) {
        const clampedStart = Math.max(dayStartSec, s.startSec);
        const clampedEnd = Math.min(dayEndSec, s.endSec);
        const topPx = ((clampedStart - dayStartSec) / 60) * PX_PER_MINUTE;
        const heightPx = Math.max(20, ((clampedEnd - clampedStart) / 60) * PX_PER_MINUTE);

        const startDate = new Date(s.startSec * 1000);
        const minStr = String(startDate.getMinutes()).padStart(2, '0');
        const isCurrent = nowSec >= s.startSec && nowSec < s.endSec;

        let extraClass = '';
        if (s.type === 'live') extraClass = 'live-slot';
        else if (s.type === 'wait') extraClass = 'wait-slot';
        else if (isCurrent) extraClass = 'active-program';

        const showThumb = heightPx >= 36;

        html += `
          <div onclick="switchChannel(${chNum})" class="epg-program-item cursor-pointer ${extraClass}" style="top:${topPx}px; height:${heightPx}px;">
            <span class="text-[11px] font-mono font-bold text-sky-400 shrink-0 leading-tight">${minStr}</span>
            ${showThumb ? `<img src="${s.thumb}" alt="" loading="lazy" class="w-12 h-7 object-cover rounded bg-zinc-900 shrink-0 mt-0.5" />` : ''}
            <div class="text-xs font-medium text-zinc-100 leading-snug line-clamp-2 break-all">${escapeHtml(s.title)}</div>
          </div>
        `;
      }
      return html;
    }

    function updateNowBar() {
      const nowBar = document.getElementById('epg-now-bar');
      if (selectedDayOffset !== 0) {
        nowBar.classList.add('hidden');
        return;
      }
      const dayStartSec = getDayStartUnixSec(0);
      const nowSec = Date.now() / 1000;
      const topPx = ((nowSec - dayStartSec) / 60) * PX_PER_MINUTE;
      nowBar.style.top = `${topPx}px`;
      nowBar.classList.remove('hidden');
    }

    function scrollToCurrentTime() {
      if (!isEpgVisible) return;
      if (selectedDayOffset !== 0) {
        selectedDayOffset = 0;
        renderEpgDayTabs();
        renderEpgGrid();
      }
      const scroller = document.getElementById('epg-scroll');
      const dayStartSec = getDayStartUnixSec(0);
      const nowSec = Date.now() / 1000;
      const topPx = ((nowSec - dayStartSec) / 60) * PX_PER_MINUTE;
      scroller.scrollTo({
        top: Math.max(0, topPx - 150),
        behavior: 'smooth'
      });
    }

    // 8. バックグラウンドで新規の通常動画（ライブ・配信アーカイブを厳密に除外）とライブ配信枠をチェック
    function parseDurationText(text) {
      if (!text) return 0;
      const parts = text.trim().split(':').map(Number);
      if (parts.some(isNaN)) return 0;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 0;
    }

    async function syncChannelVideosAndLiveStatus() {
      // URLパラメータでのライブ枠テスト指定にも対応 (?live=VIDEO_ID&start=UNIX_SEC)
      const params = new URLSearchParams(location.search);
      if (params.get('live')) {
        liveStreamInfo.videoId = params.get('live');
        liveStreamInfo.title = params.get('title') || 'たかねこちゃんねる ライブ';
        liveStreamInfo.startTimeSec = params.get('start')
          ? Number(params.get('start'))
          : Math.floor(Date.now() / 1000) - 60;
        liveStreamInfo.endTimeSec = liveStreamInfo.startTimeSec + 7200;
        liveStreamInfo.isLiveNow = Math.floor(Date.now() / 1000) >= liveStreamInfo.startTimeSec;
        renderEpgGrid();
        syncPlayback(false);
      }

      // 1) @takaneko_ch/videos からライブ配信・配信アーカイブを除く純粋な通常動画のみを取得
      try {
        const videosHtml = await fetchWithProxyFallback(`https://www.youtube.com/${CHANNEL_HANDLE}/videos?hl=ja`);
        const initialData = extractYtInitialData(videosHtml);
        if (initialData) {
          const renderers = collectVideoRenderers(initialData);
          const existingIds = new Set(videoCatalog.map(v => v.id));
          let addedNewVideo = false;

          for (const vr of renderers) {
            const vid = vr.videoId;
            if (!vid || existingIds.has(vid)) continue;

            const publishedText = vr.publishedTimeText?.simpleText || '';
            const isStreamArchive = publishedText.includes('配信済み') || publishedText.toLowerCase().includes('streamed');
            const isLiveOrUpcoming = !!vr.upcomingEventData ||
              JSON.stringify(vr.badges || []).includes('LIVE') ||
              JSON.stringify(vr.thumbnailOverlays || []).includes('LIVE');

            // ライブ配信およびライブアーカイブは通常動画カタログに一切含めない
            if (isStreamArchive || isLiveOrUpcoming) continue;

            const title = vr.title?.runs?.[0]?.text || vr.title?.simpleText || '';
            const lenText = vr.lengthText?.simpleText ||
              vr.thumbnailOverlays?.find(o => o.thumbnailOverlayTimeStatusRenderer)?.thumbnailOverlayTimeStatusRenderer?.text?.simpleText;
            const durationSec = parseDurationText(lenText);

            if (title && durationSec > 0) {
              existingIds.add(vid);
              videoCatalog.push({
                id: vid,
                title: title,
                duration: durationSec,
                thumb: `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`
              });
              addedNewVideo = true;
            }
          }

          if (addedNewVideo) {
            renderEpgGrid();
            syncPlayback(false);
          }
        }
      } catch (_) {}

      // 2) @takaneko_ch/streams から現在予定されているライブ枠または配信中のライブ枠のみを検知（過去のライブアーカイブは無視）
      try {
        const streamsHtml = await fetchWithProxyFallback(`https://www.youtube.com/${CHANNEL_HANDLE}/streams?hl=ja`);
        const streamsData = extractYtInitialData(streamsHtml);
        if (streamsData) {
          const renderers = collectVideoRenderers(streamsData);
          let foundActiveOrUpcomingLive = false;

          for (const sr of renderers) {
            const vid = sr.videoId;
            if (!vid) continue;
            const title = sr.title?.runs?.[0]?.text || sr.title?.simpleText || 'たかねこちゃんねる ライブ';
            const isLiveNowBadge = JSON.stringify(sr.badges || []).includes('LIVE') ||
              JSON.stringify(sr.thumbnailOverlays || []).includes('"style":"LIVE"');

            if (isLiveNowBadge) {
              liveStreamInfo.videoId = vid;
              liveStreamInfo.title = title;
              if (!liveStreamInfo.startTimeSec) {
                liveStreamInfo.startTimeSec = Math.floor(Date.now() / 1000) - 180;
              }
              liveStreamInfo.endTimeSec = liveStreamInfo.startTimeSec + 7200;
              liveStreamInfo.isLiveNow = true;
              foundActiveOrUpcomingLive = true;
              break;
            } else if (sr.upcomingEventData && sr.upcomingEventData.startTime) {
              liveStreamInfo.videoId = vid;
              liveStreamInfo.title = title;
              liveStreamInfo.startTimeSec = Number(sr.upcomingEventData.startTime);
              liveStreamInfo.endTimeSec = liveStreamInfo.startTimeSec + 7200;
              liveStreamInfo.isLiveNow = false;
              foundActiveOrUpcomingLive = true;
              break;
            }
          }

          if (!foundActiveOrUpcomingLive && !params.get('live')) {
            if (liveStreamInfo.videoId !== null) {
              liveStreamInfo.videoId = null;
              liveStreamInfo.startTimeSec = null;
              liveStreamInfo.endTimeSec = null;
              liveStreamInfo.isLiveNow = false;
            }
          }

          renderEpgGrid();
          syncPlayback(false);
        }
      } catch (_) {}
    }

    async function fetchWithProxyFallback(targetUrl) {
      const proxies = [
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
      ];
      for (const buildUrl of proxies) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(buildUrl(targetUrl), { signal: controller.signal });
          clearTimeout(timer);
          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 500) return text;
          }
        } catch (_) {}
      }
      return null;
    }

    function extractYtInitialData(html) {
      if (!html) return null;
      const match = html.match(/(?:var\s+ytInitialData|window\["ytInitialData"\])\s*=\s*(\{.+?\});<\/script>/s);
      if (match && match[1]) {
        try {
          return JSON.parse(match[1]);
        } catch (_) {}
      }
      return null;
    }

    function collectVideoRenderers(obj, results = []) {
      if (!obj || typeof obj !== 'object') return results;
      if (obj.videoRenderer && obj.videoRenderer.videoId) {
        results.push(obj.videoRenderer);
        return results;
      }
      for (const key of Object.keys(obj)) {
        collectVideoRenderers(obj[key], results);
      }
      return results;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function tickClock() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${hh}:${mm}:${ss}`;
    }

    // 9. 初期起動
    window.addEventListener('DOMContentLoaded', () => {
      tickClock();
      setupPlayerOverlayInteractions();
      renderEpgDayTabs();
      renderEpgGrid();
      syncPlayback(false);
      loadYouTubeApi();

      setTimeout(scrollToCurrentTime, 100);

      syncChannelVideosAndLiveStatus();

      setInterval(() => {
        tickClock();
        syncPlayback(false);
        updateNowBar();
      }, 1000);

      setInterval(() => {
        renderEpgGrid();
      }, 60000);

      setInterval(() => {
        syncChannelVideosAndLiveStatus();
      }, 180000);
    });
  </script>
</body>
